<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Carnet Dilerna</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icones/icone-180.png">
<meta name="theme-color" content="#F8F4EC">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dilerna">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..700&family=Sacramento&display=swap">
<style>
/* Layout: app iPhone une colonne — en-tête collant, contenu défilant, barre d'onglets fixe en bas.
   Charte du site Dilerna : crème, chocolat, bordeaux, rose poudré ; Gloock + DM Sans + néon Sacramento */
:root{
  --bg:#F8F4EC; --bg-alt:#EFE7DB; --surface:#FFFAF5; --ink:#210202; --choco:#4E2E22; --muted:#6E5248; --line:rgba(33,2,2,.13);
  --accent:#6D1F2E; --accent-hover:#8A6A55; --accent-ink:#FFF4EC; --accent-soft:#EADCCB; --eyebrow:#6D1F2E;
  --st-abonnee:#6D1F2E; --st-fidele:#4E2E22; --st-nouvelle:#AB9680; --st-attention:#B8650A;
  --b0:#4E2E22; --b0f:#F8F4EC; --b1:#D8C6B6; --b1f:#3A2018; --b2:#8A6A55; --b2f:#FFF4EC; --b3:#E3D3C0; --b3f:#4E2E22; --b4:#6D1F2E; --b4f:#FFF4EC;
  --ok:#4E9A2A; --warn:#B8650A; --bad:#B3261E;
  --display:"DM Sans", -apple-system, system-ui, sans-serif;
  --body:"DM Sans", -apple-system, "Segoe UI", system-ui, sans-serif;
  --neon:"Sacramento", cursive;
  --radius:22px;
  --shadow:0 18px 40px -22px rgba(78,46,34,.35), 0 1px 2px rgba(78,46,34,.06);
  --logo-light:block; --logo-dark:none;
  --page:#EFE3D6; --glow-1:rgba(171,150,128,.22); --glow-2:rgba(16,175,192,.14);
}
/* Toujours en clair, même si l'iPhone est en mode sombre */
:root,:root[data-theme="dark"]{color-scheme:light}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(72px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;isolation:isolate;background:var(--bg);box-shadow:0 8px 10px -10px rgba(78,46,34,.35);padding-block:8px 4px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;flex-direction:column;gap:0;min-width:0}
.brand img{height:22px;width:auto}
.brand .lg-light{display:var(--logo-light)}.brand .lg-dark{display:var(--logo-dark)}
.brand small{display:none}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;height:34px;min-width:34px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:600;font-size:13px}

h2.sec{font-family:var(--display);font-weight:700;font-size:20px;line-height:1.15;letter-spacing:-.01em;margin:18px 0 8px;text-wrap:balance}
.label{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--eyebrow);font-weight:500}

/* Bandeau jours */
.week{display:grid;grid-template-columns:auto repeat(7,1fr) auto;gap:4px;align-items:center;margin-top:4px}
.week .nav{border:0;background:none;font-size:20px;color:var(--muted);width:28px;height:52px}
.day{border:0;background:none;border-radius:14px;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.day .d1{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.day .d2{font-size:17px;font-weight:700}
.day .dots{height:6px;display:flex;gap:2px}
.day .dots i{width:5px;height:5px;border-radius:50%;background:var(--muted);opacity:.6}
.day.today .d2{color:var(--accent-hover)}
.day.sel{background:var(--choco);color:var(--bg)}
.day.sel .d1{color:var(--bg);opacity:.75}
.day.sel .d2{color:var(--bg)}
.day.sel .dots i{background:var(--bg)}

.dayhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:18px 0 10px}
.dayhead h2{margin:0}
.dayhead .tot{font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap}

/* Cartes rdv */
.list{display:flex;flex-direction:column;gap:8px}
.rdv{display:grid;grid-template-columns:54px 1fr auto;gap:12px;align-items:center;background:var(--surface);border-radius:18px;padding:12px 14px;border:0;text-align:left;box-shadow:var(--shadow);position:relative;overflow:hidden;width:100%}
.rdv::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--c,var(--muted))}
.rdv .h{font:700 16px/1.15 var(--body)}
.rdv .h small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.rdv .who{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rdv .what{font-size:13px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rdv .price{font-weight:700;text-align:right}
.rdv .price small{display:block;font-weight:600;font-size:11px}
.rdv.done{opacity:.72}
.rdv.cancel .who,.rdv.cancel .price{text-decoration:line-through;color:var(--muted)}
.gap{border:1.5px dashed var(--line);border-radius:14px;padding:9px 14px;color:var(--muted);font-size:13px;display:flex;justify-content:space-between;background:none;width:100%;text-align:left}
.gap b{color:var(--ink);font-weight:600}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c)}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.tag{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px}
.tag.fait{color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.tag.lapin{color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
.tag.annule{color:var(--muted);background:var(--line)}

.empty{background:var(--surface);border-radius:16px;padding:22px 18px;text-align:center;color:var(--muted);box-shadow:var(--shadow)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

/* Clientes */
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 14px;margin:6px 0 10px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.chip.on{background:var(--choco);color:var(--bg);border-color:var(--choco)}
.qrow{position:relative;display:flex;gap:8px;align-items:center;margin:6px 0 10px}
.qrow .search{flex:1;min-width:0;margin:0}
.tribtn{flex:none;display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 11px;font-size:13px;font-weight:800;color:var(--choco);white-space:nowrap}
.tribtn svg{width:15px;height:15px}
.trimenu{position:absolute;right:0;top:calc(100% + 6px);z-index:22;background:var(--surface);border-radius:14px;box-shadow:0 18px 40px -12px rgba(40,20,10,.45);padding:6px;display:flex;flex-direction:column;min-width:200px;animation:pop .14s ease-out}
.trimenu button{border:0;background:none;text-align:left;padding:10px 11px;border-radius:9px;font-size:14px;font-weight:600;display:flex;justify-content:space-between;gap:10px}
.trimenu button.on{background:var(--bg-alt);font-weight:800;color:var(--choco)}
.trimenu button.on::after{content:"✓"}
.filters.une{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;gap:5px}
.filters.une::-webkit-scrollbar{display:none}
.filters.une .chip{flex:none;white-space:nowrap;padding:5px 11px;font-size:12.5px}
.cli{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:0;border-radius:14px;padding:10px 12px;text-align:left;width:100%;box-shadow:var(--shadow)}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:var(--surface);background:var(--c)}
.cli .n{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cli .s{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cli .r{font-size:12px;color:var(--muted);text-align:right}

/* Bilan */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{background:var(--surface);border-radius:16px;padding:14px;box-shadow:var(--shadow);min-width:0}
.kpi .v{font:700 24px/1.15 var(--body);margin-top:4px}
.kpi .v small{font-size:13px;color:var(--muted);font-weight:600}
.kpi.alert{background:var(--accent-soft)}
.kpi.alert .v{color:var(--accent)}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden;display:flex;margin-top:10px}
.bar span{display:block;height:100%}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:middle}
.card{background:var(--surface);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.coach{border-left:3px solid var(--accent);padding:10px 14px;background:var(--accent-soft);border-radius:0 12px 12px 0;font-size:14px;margin-top:10px}

/* Onglets */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
nav.tabs button{border:0;background:none;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--muted)}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--accent)}
nav.tabs{box-shadow:0 -10px 30px -20px rgba(78,46,34,.4)}
.fab{position:fixed;right:max(18px,calc(env(safe-area-inset-right,0px) + 18px));bottom:calc(74px + env(safe-area-inset-bottom,0px));z-index:26;width:58px;height:58px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font-size:30px;line-height:1;box-shadow:0 10px 24px -8px rgba(109,31,46,.7)}

/* Feuilles (modales) */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(20,10,22,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92%;overflow-y:auto;border-radius:22px 22px 0 0;padding-block:8px calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
/* fiche cliente : s'ouvre en grand, sur tout l'écran */
.scrim.grand .sheet{height:100%;max-height:100%;border-radius:0;padding-top:max(14px,env(safe-area-inset-top,0px))}
.scrim .sheet{overscroll-behavior:contain}
.scrim.grand .grab{margin-top:0}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.sheet-h h3{font-family:var(--display);font-weight:700;font-size:21px;letter-spacing:-.01em;margin:0}
.link{border:0;background:none;color:var(--accent);font-weight:700;padding:6px 0}
form.f{display:flex;flex-direction:column;gap:12px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld label{font-size:12px;font-weight:700;color:var(--muted)}
.fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px;font-size:16px}
.fld textarea{min-height:80px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:10px}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 12px}
.opt input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}
.opt .p{font-weight:700}
.gift{border:1px solid var(--line);background:none;border-radius:999px;padding:4px 9px;font-size:12px;font-weight:700;color:var(--muted)}
.gift.on{background:var(--warn);border-color:var(--warn);color:#fff}
.gift[disabled]{opacity:.35}
.total{display:flex;justify-content:space-between;align-items:baseline;background:var(--choco);color:var(--bg);border-radius:var(--radius);padding:12px 16px}
.total b{font:700 24px/1 var(--body)}
.total small{display:block;font-size:12px;opacity:.75}
.btn{border:2px solid transparent;border-radius:999px;min-height:50px;padding:12px 20px;letter-spacing:.01em;box-shadow:0 8px 20px -12px rgba(109,31,46,.8);transition:transform .2s,background-color .2s;font-weight:700;font-size:15px;background:var(--accent);color:var(--accent-ink);width:100%}
.btn:active{transform:scale(.96)}
.btn.ghost{background:transparent;color:var(--ink);border-color:currentColor;box-shadow:none}
.btn.danger{background:none;color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent);box-shadow:none}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{border:0;background:none;border-radius:9px;padding:8px 2px;font-size:12.5px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--c,var(--choco));color:var(--surface)}
.msg{white-space:pre-wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:14px;user-select:text;-webkit-user-select:text}
.confirm{background:var(--accent-soft);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.ficheTop{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}
.ficheTop .av{width:58px;height:58px;font-size:22px}
.av.estnew{position:relative;overflow:visible}
.av.estnew::after{content:"NEW";position:absolute;bottom:-5px;left:50%;transform:translateX(-50%);font-size:9px;line-height:1;font-weight:800;letter-spacing:.06em;padding:3px 5px;border-radius:999px;background:#CDBBA2;color:#4E2E22;box-shadow:0 0 0 2px var(--surface)}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.stats3 .kpi{padding:10px 12px}
.stats3 .kpi .v{font-size:21px}
.note{background:var(--surface);border-radius:12px;padding:12px;white-space:pre-wrap;border:1px solid var(--line)}
.note.allergy{border-color:var(--bad);color:var(--bad);font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:700;font-size:14px;z-index:60;max-width:calc(100% - 32px);text-align:center}
.banner{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--muted);margin-top:8px}
.catrow{display:grid;grid-template-columns:1fr 70px 70px 32px;gap:6px;align-items:center}
.catrow input{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 8px;font-size:15px;width:100%;min-width:0}
.catrow .x{border:0;background:none;color:var(--bad);font-size:20px}
@media (max-width:380px){.three{grid-template-columns:1fr 1fr}.three .fld:first-child{grid-column:1/-1}}
/* Agenda : la semaine, comme le semainier papier (créneaux de 30 min) */
.wkhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 0 6px}
.mlabel{position:relative;text-align:center;flex:1;min-width:0}
.mlabel b{display:block;font:700 17px/1.1 var(--body);color:var(--choco)}
.mlabel b .yr{font:500 17px/1 var(--body);color:var(--muted);margin-left:5px}
.mlabel small{font-size:12px;color:var(--eyebrow);font-weight:600}
.mlabel{border:0;background:none;padding:0;color:inherit;cursor:pointer}
.mfleche{font-size:11px;color:var(--b2);margin-left:4px;vertical-align:.15em}
.mnav{display:flex;justify-content:space-between;align-items:center;margin:0 0 12px}
.mtitre{display:flex;flex-direction:column;align-items:center;line-height:1.1}
.mtitre b{font:800 19px/1.1 var(--body);letter-spacing:.14em;color:var(--choco)}
.mtitre small{font-size:12px;color:var(--muted);font-weight:600;margin-top:2px}
.mj i{display:block;width:6px;height:6px;border-radius:50%}
.p1{background:var(--b1)}.p2{background:var(--b3)}.p3{background:var(--accent)}
.mgrille{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.mgrille .mvide{min-height:48px}
.mgrille .me{font-size:11px;font-weight:800;color:var(--muted);padding:2px 0}
.mj{border:0;background:var(--surface);border-radius:12px;padding:9px 0 6px;font:700 15px/1 var(--body);color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:5px;min-height:48px}
.mj i{background:transparent}
.mj i.p1{background:var(--b1)}.mj i.p2{background:var(--b3)}.mj i.p3{background:var(--accent)}
.mj.ferme{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--b1) 22%,transparent) 0 5px,transparent 5px 10px);color:#CDBBA2}
.mj.auj{background:var(--choco);color:var(--bg)}
.mj.auj i{box-shadow:0 0 0 1.5px var(--bg)}
.mj.sel:not(.auj){box-shadow:inset 0 0 0 2px var(--choco)}
.wview{touch-action:pan-y;user-select:none;-webkit-user-select:none;overflow:hidden}
.wanim-l{animation:wl .28s ease-out}.wanim-r{animation:wr .28s ease-out}
@keyframes wl{from{transform:translateX(40%);opacity:.2}to{transform:none;opacity:1}}
@keyframes wr{from{transform:translateX(-40%);opacity:.2}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.wanim-l,.wanim-r{animation:none}}
.wgrid{display:grid;grid-template-columns:28px repeat(7,minmax(0,1fr));column-gap:2px}
.wday{border:0;background:none;padding:2px 0 8px;display:flex;flex-direction:column;align-items:center;gap:0;color:var(--muted);min-width:0;position:relative;border-bottom:1px solid var(--line)}
.wday .l{font-size:11.5px;font-weight:600;color:var(--muted)}
.wday .n{font:700 19px/1.15 var(--body);color:#CDBBA2}
.wday.today .n{color:var(--choco);font-weight:800}.wday.today .l{color:var(--choco);font-weight:800}
.wday.sel::after{content:"";position:absolute;left:22%;right:22%;bottom:-1px;height:3px;border-radius:3px;background:var(--choco)}
.wtimes{position:relative}
.wtimes span{position:absolute;left:0;right:4px;font-size:10.5px;font-weight:400;color:var(--muted);text-align:right;transform:translateY(-6px)}
.wtimes span.full{font-weight:800;color:var(--choco);font-size:12.5px}
.wcol{position:relative;border-left:1px solid var(--line)}
.wcol.we{background-color:color-mix(in srgb,var(--bg-alt) 55%,transparent)}
.wcol.sel{background-color:color-mix(in srgb,var(--accent-soft) 60%,transparent)}
.wblk{position:absolute;left:1px;right:1px;border:0;border-radius:6px;padding:3px 3px 3px 4px;text-align:left;overflow:hidden;display:flex;flex-direction:column;gap:1px;
  background:var(--tb);color:var(--tf);min-width:0}
.wblk .pr.one{-webkit-line-clamp:1}
.wblk .pr{font-size:11px;font-weight:500;line-height:1.15;opacity:.92;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.wblk .w{font-size:13px;letter-spacing:-.01em;font-weight:700;line-height:1.15;overflow:hidden;text-overflow:clip;white-space:nowrap}
.wblk .t{font-size:10.5px;font-variant-numeric:tabular-nums;opacity:.8;font-weight:600;line-height:1.2}
.wblk.cancel{opacity:.4}.wblk.cancel .w{text-decoration:line-through}
.wblk.done{opacity:.7}
.wtap{position:absolute;left:1px;right:1px;border-radius:6px;background:var(--accent-soft);color:var(--accent);border:2px dashed var(--accent);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;pointer-events:none;z-index:3;animation:tap .18s ease-out}
@keyframes tap{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.wcell{position:absolute;left:0;right:0;border:0;padding:0;margin:0;background:transparent;border-bottom:1px solid color-mix(in srgb,var(--line) 55%,transparent);
  display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;color:transparent;transition:background-color .08s}
.wcell.h{border-bottom-color:var(--line)}
.wcell:active{background:color-mix(in srgb,var(--accent-soft) 70%,transparent)}
.wcell.sel{background:var(--accent-soft);color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent);border-radius:6px;z-index:2}
.wblk{z-index:1}
.hr:active{background:var(--accent-soft)}
.wnow{position:absolute;left:-1px;right:0;height:2px;background:var(--accent-hover);z-index:2;pointer-events:none}
/* L'heure qu'il est : la demi-heure en cours prend une couleur, au lieu d'un trait */
.wcell.maintenant,.drow.maintenant{background:color-mix(in srgb,var(--b1) 85%,transparent)!important;border-radius:4px}
.wtimes span.maint{color:var(--choco);font-weight:800}
.wsum{display:flex;justify-content:space-between;font-size:13px;font-weight:600;color:var(--muted);margin-top:10px}
.swipehint{font-size:12px;color:var(--muted);text-align:center;margin-top:6px}

/* Journalier : planning du jour */
.pj-title{font:700 26px/1 var(--display);letter-spacing:-.02em;text-transform:uppercase;margin:4px 0 12px;color:var(--choco)}
.datepill{display:inline-flex;align-items:center;gap:2px;border:1.5px solid var(--choco);border-radius:999px;padding:2px 4px;color:var(--choco)}
.datepill button{border:0;background:none;width:32px;height:32px;font-size:18px;color:inherit}
.datepill span{font-weight:600;font-size:14px;padding:0 4px;white-space:nowrap}
.wk{display:flex;justify-content:space-between;gap:4px;margin:16px 0 6px}
.wk button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:5px;font-weight:700;font-size:13px;color:var(--choco);flex:1;min-width:0}
.wk i{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--choco);display:grid;place-items:center}
.wk .has i::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent-hover)}
.wk .on i{background:var(--choco)}
.wk .on.has i::after{background:var(--bg)}
.hgrid{position:relative;margin-top:10px}
.hr{display:flex;align-items:flex-start;width:100%;height:60px;border:0;border-top:1px solid var(--line);background:none;padding:0;text-align:left;color:var(--muted)}
.hr span{width:58px;flex:none;font-size:12px;font-weight:600;letter-spacing:.04em;padding-top:5px}
.hr em{font-style:normal;font-size:12px;opacity:0;padding-top:5px}
.hr:hover em,.hr:focus-visible em{opacity:1}
.blk{position:absolute;border:0;border-radius:10px;background:var(--tb);color:var(--tf);text-align:left;padding:5px 10px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-start;min-width:0}
.blk .t{font-size:11.5px;opacity:.8;font-weight:600;white-space:nowrap}
.blk .w{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk .p{font-size:12px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk.short{flex-direction:row;align-items:center;gap:6px}
.blk.cancel{opacity:.45}.blk.cancel .w{text-decoration:line-through}
.blk.done{opacity:.75}
.nowline{position:absolute;left:52px;right:0;height:2px;background:var(--accent-hover);z-index:2;pointer-events:none}
.nowline::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--accent-hover)}
.dsum{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);font-weight:600;margin-top:4px}
.box{border:1.5px solid var(--choco);border-radius:18px;padding:24px 14px 10px;position:relative;margin-top:30px}
.box h4{position:absolute;top:-15px;left:50%;transform:translateX(-50%);margin:0;background:var(--choco);color:var(--bg);border-radius:999px;padding:8px 18px;font:600 12px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
.todo{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding:8px 0;min-height:44px}
.todo:last-child{border-bottom:0}
.todo .ck{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--choco);background:none;flex:none;display:grid;place-items:center;color:var(--bg);font-size:12px;padding:0}
.todo.done .ck{background:var(--choco)}
.todo .tx{flex:1;min-width:0;overflow-wrap:anywhere}
.todo.done .tx{text-decoration:line-through;color:var(--muted)}
.todo .rm{border:0;background:none;color:var(--muted);font-size:18px;padding:0 4px}
.todo input{flex:1;min-width:0;border:0;background:none;font-size:16px;padding:4px 0}
.todo input::placeholder{color:var(--muted)}
.todo input:focus,.todo input:focus-visible{outline:none}
.todo:focus-within .ck.add{border-color:var(--accent-hover);color:var(--accent-hover)}
.todo .ck.add{border-style:dashed;color:var(--muted)}

/* Raccourcis de date */
.quick{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.quick::-webkit-scrollbar{display:none}
.quick button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600}
.quick button:active{background:var(--choco);color:var(--bg)}
.dhint{font-size:13px;color:var(--muted);margin-top:-4px}
.dhint b{color:var(--ink)}

/* Recherche de cliente */
.ac{position:relative}
.ac input{padding-left:34px!important}
.ac .dot{position:absolute;left:13px;top:50%;width:11px;height:11px;margin-top:-5.5px;border-radius:50%;background:var(--c,var(--line));pointer-events:none}
.acl{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:5;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.acl button{display:flex;align-items:center;gap:10px;width:100%;border:0;border-bottom:1px solid var(--line);background:none;padding:11px 12px;text-align:left;font-size:15px}
.acl button:last-child{border-bottom:0}
.acl button i{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.acl button small{margin-left:auto;color:var(--muted);font-size:12px}
.acl button.new{color:var(--accent);font-weight:700}
.sheet-tools{display:flex;gap:8px;align-items:center}
.plusbtn{white-space:nowrap;flex:none;border:0;border-radius:999px;background:var(--accent);color:var(--accent-ink);height:34px;padding:0 13px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:4px}
.xbtn{border:1px solid var(--line);background:var(--surface);border-radius:50%;width:34px;height:34px;font-size:18px;line-height:1;color:var(--muted)}

/* Semaine : bascule matin / après-midi */
.half{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;margin:0 0 6px}
.half button{border:0;background:none;border-radius:9px;padding:7px 2px;font-weight:700;font-size:14px;color:var(--muted)}
.half button.on{background:var(--accent);color:var(--accent-ink)}
/* Pause de midi (12h-14h) */
.wcol.fermee .wcell{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--b1) 26%,transparent) 0 6px,transparent 6px 12px)}
.fermetag{position:absolute;left:50%;top:32%;z-index:1;transform:translateX(-50%) rotate(180deg);writing-mode:vertical-rl;font-size:10px;font-weight:800;letter-spacing:.24em;text-transform:uppercase;color:var(--b2);pointer-events:none;white-space:nowrap}
.hcard{padding:2px 12px}
.horaire{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.horaire:last-child{border-bottom:0}
.horaire .hj{display:grid;grid-template-columns:42px 1fr;gap:8px;align-items:center;border:0;background:none;padding:0;text-align:left;color:inherit;min-width:0}
.horaire .hj b{font-weight:800}
.horaire .hj span{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.horaire.ferme .hj span{color:#CDBBA2;font-style:italic}
.horaire .x{border:0;background:none;color:var(--muted);font-size:18px;padding:0 4px}
.sw{width:42px;height:24px;border-radius:999px;border:0;background:var(--line);position:relative;padding:0;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.2);transition:left .15s}
.sw.on{background:var(--choco)}
.sw.on::after{left:21px}
.hedit{display:grid;grid-template-columns:1fr 1fr;gap:6px 8px;padding:6px 0 10px;border-bottom:1px solid var(--line)}
.hedit label{display:flex;flex-direction:column;gap:3px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--eyebrow)}
.hedit input{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:7px 8px;font-size:15px}
.hedit .link{grid-column:span 2;justify-self:end}
.bobj{display:block;border:0;background:none;padding:0;margin:4px auto 10px}
.anneau{width:168px;height:168px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--line) 0)}
.anneau>span{width:134px;height:134px;border-radius:50%;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:12px;color:var(--muted);padding:0 14px;line-height:1.25}
.anneau b{font-size:24px;color:var(--choco);margin-bottom:3px}
.bpres{display:flex;flex-direction:column;gap:9px;margin-top:8px}
.bp{display:grid;grid-template-columns:70px 1fr 58px;gap:8px;align-items:center;font-size:13px;white-space:nowrap}
.bp span{overflow:hidden;text-overflow:ellipsis}
.bp i{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.bp i::before{content:"";display:block;height:100%;width:var(--w);background:var(--c,var(--accent));border-radius:5px}
.bp em{font-style:normal;font-weight:800;text-align:right}
.wcell.lunch,.drow.lunch{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--b1) 38%,transparent) 0 6px,color-mix(in srgb,var(--b1) 18%,transparent) 6px 12px)}
.wtimes span.lunch{color:var(--b2)}
.lunchtag{position:absolute;left:0;right:0;text-align:center;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--b2);pointer-events:none;z-index:0}
/* Glisser un rendez-vous */
.wblk,.blk{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.lift{z-index:30!important;box-shadow:0 14px 28px -6px rgba(33,2,2,.5)!important;outline:2px solid var(--accent-hover);opacity:1!important}
.dropto{display:none;position:absolute;right:3px;top:3px;background:var(--accent-hover);color:#fff;font-size:10.5px;font-weight:800;border-radius:5px;padding:1px 4px;z-index:2}
.lift .dropto{display:block}
/* Journalier : journée en grand */
.dstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:12px 0 8px}
.dstrip button{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:5px 0;display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--choco)}
.dstrip .l{font-size:12px;font-weight:700}.dstrip .n{font-size:17px;font-weight:700}.dstrip .c{font-size:10px;color:var(--muted);font-weight:600}
.dstrip button.on{background:var(--choco);border-color:var(--choco);color:var(--bg)}.dstrip button.on .c{color:var(--bg);opacity:.8}
.dstrip button.today:not(.on){border-color:var(--choco)}
.dstrip button.target{border-color:var(--accent-hover);background:var(--accent-soft)}
.dgrid{position:relative;display:grid;margin-top:6px}
.drow{display:flex;align-items:center;border:0;border-bottom:1px solid color-mix(in srgb,var(--line) 55%,transparent);background:none;padding:0 8px 0 0;text-align:left;height:36px}
.drow.h{border-bottom-color:var(--line)}
.drow .lb{width:54px;flex:none;font-size:12.5px;color:var(--muted);text-align:right;padding-right:10px}
.drow .lb.f{font-weight:800;color:var(--choco);font-size:13.5px}
.drow .ad{margin-left:auto;font-size:12px;color:var(--accent);font-weight:700;opacity:0}
.drow:active{background:var(--accent-soft)}.drow:active .ad{opacity:1}
.dlayer{position:absolute;top:0;bottom:0;left:58px;right:4px;pointer-events:none}
.dlayer .blk{pointer-events:auto;left:0;right:0}

/* Clientes : noms en grand, cœur pour les abonnées */
.cli .n{font-size:18px;font-weight:800;letter-spacing:-.01em}
.av{background:var(--choco)!important;color:var(--bg)!important}
.heart,.hk{color:var(--accent-hover);font-style:normal;margin-right:4px}
.abo .hrt{color:var(--accent-hover)!important}
.ctag.tabo{background:var(--accent-hover)!important;color:#fff!important}
.ctag{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--bg-alt);color:var(--choco)}
.ctag.new{background:var(--accent-soft);color:var(--accent)}
.ctag.tabo{background:var(--accent);color:var(--accent-ink)}
.chip.on{background:var(--choco);color:var(--bg)}
.acl button i{background:var(--choco)!important}
.abo{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer}
.abo input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.abo .hrt{font-size:22px;color:var(--accent)}
.abo small{display:block;font-size:12px;color:var(--muted)}
/* Clientes : tri */
.sortrow{display:flex;align-items:center;gap:10px;margin:-4px 0 12px}
.sortrow .label{flex:none}
.sortrow .quick{flex:1;min-width:0}
.sortrow .quick button.on{background:var(--choco);border-color:var(--choco);color:var(--bg)}
.letter{font:800 15px/1 var(--body);color:var(--accent);margin:8px 0 -2px 4px}
.list:has(.azbar){padding-right:16px}
.azbar{position:fixed;right:max(2px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);z-index:24;display:flex;flex-direction:column;align-items:center;padding:4px 0;touch-action:none;user-select:none;-webkit-user-select:none}
.screen>.azbar,.screen>.azpop{position:absolute}
.screen>.azbar{right:3px;top:54%}
.screen:has(#layer:not(:empty))>.azbar{display:none}
.azbar button{border:0;background:none;padding:1px 4px;font:800 11px/1.25 var(--body);color:var(--accent)}
.azpop{position:fixed;left:50%;top:45%;transform:translate(-50%,-50%);z-index:27;width:72px;height:72px;border-radius:20px;background:var(--choco);color:var(--bg);display:grid;place-items:center;font:800 34px/1 var(--body);pointer-events:none;opacity:.92}
.letter:first-child{margin-top:0}
/* Semaine : les ronds des jours ouvrent la journée */
button.wday{cursor:pointer;font:inherit;transition:background-color .15s;border-radius:10px 10px 0 0}
button.wday:hover .n{color:var(--choco)}
button.wday:active{background:var(--accent-soft)}
.dscroll{grid-column:2/-1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;touch-action:pan-x;overscroll-behavior-x:contain;min-width:0}
.dscroll::-webkit-scrollbar{display:none}
.dweek{flex:0 0 100%;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));column-gap:2px;scroll-snap-align:start;scroll-snap-stop:always}
.wday .c{height:13px;font-size:10px;font-weight:700;color:var(--b2);line-height:13px;white-space:nowrap}
.wtop{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 10px}
/* Rdv cachés dans l'autre demi-journée */
.half button{position:relative}
.half .cnt{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;margin-left:6px;border-radius:999px;background:var(--accent-hover);color:#fff;font-size:11.5px;font-weight:800;vertical-align:1px}
.half button.on .cnt{background:var(--accent-ink);color:var(--accent)}
.more{position:absolute;left:2px;right:2px;z-index:4;border:0;border-radius:999px;background:var(--accent-hover);color:#fff;font:800 10.5px/1 var(--body);padding:4px 0;box-shadow:0 4px 10px -4px rgba(138,106,85,.6)}
.more.bas{bottom:2px}.more.haut{top:2px}
/* Bulle rapide : s'ouvre sur la case touchée (nouveau rdv) */
.bscrim{position:fixed;inset:0;z-index:40;background:rgba(33,2,2,.22)}
.bhole{position:absolute;border-radius:6px;background:var(--accent-soft);box-shadow:0 0 0 2px var(--accent),0 8px 18px -8px rgba(33,2,2,.55);color:var(--accent);font-size:11.5px;font-weight:800;display:grid;place-items:start center;padding-top:3px;pointer-events:none;transition:height .15s}
.bulle{position:absolute;left:10px;right:10px;background:var(--surface);border-radius:20px;padding:12px;box-shadow:0 24px 50px -16px rgba(33,2,2,.6);display:flex;flex-direction:column;gap:9px;animation:pop .16s ease-out}
.bulle .in{display:flex;flex-direction:column;gap:9px;overflow-y:auto;scrollbar-width:none;min-height:0}
.bulle .in::-webkit-scrollbar{display:none}
.bulle .in>*{flex-shrink:0}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.bulle{animation:none}.bhole{transition:none}}
.bpt{position:absolute;width:16px;height:16px;background:var(--surface);transform:rotate(45deg);border-radius:3px}
.bh{display:flex;align-items:center;gap:8px}
.bh b{font-size:16px;color:var(--choco);letter-spacing:-.01em}
.bh .fin{font-size:12px;color:var(--muted);margin-left:auto;white-space:nowrap}
.bh .xbtn{width:30px;height:30px;flex:none}
.bq{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;font-size:16px}
.bsug{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.bsug button{display:flex;align-items:center;gap:10px;border:0;border-bottom:1px solid var(--line);background:var(--bg);padding:9px 12px;text-align:left;font-weight:700;font-size:15px}
.bsug button:last-child{border-bottom:0}
.bsug button small{margin-left:auto;font-weight:600;font-size:11.5px;color:var(--muted)}
.bsug button.new{color:var(--accent)}
.bsug .t{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--eyebrow);padding:7px 12px 3px;background:var(--bg)}
.bwho{display:flex;align-items:center;gap:10px}
.bwho .av{width:38px;height:38px;font-size:14px;flex:none}
.bwho b{font-size:17px;letter-spacing:-.01em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bwho .link{margin-left:auto;font-size:13px;white-space:nowrap}
.bwarn{font-size:13px;font-weight:700;color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent);border-radius:10px;padding:7px 10px}
.habit{border:0;border-radius:18px;background:var(--bg-alt);color:var(--choco);padding:11px 13px;text-align:left;display:flex;flex-direction:column;gap:2px;width:100%}
.habit .k{font:800 10.5px/1.2 var(--body);letter-spacing:.22em;text-transform:uppercase;color:var(--b2);margin-bottom:3px}
.habit b{font-size:16px}
.habit span:last-child{font-size:12.5px;opacity:.8}
.habit.on{background:var(--choco);color:var(--bg);box-shadow:0 12px 24px -14px rgba(78,46,34,.9)}
.habit.on .k{color:var(--b1)}

<script>
(() => {
const STATUTS = {
  abonnee:  {label:"Abonnée",  c:"var(--st-abonnee)"},
  fidele:   {label:"Fidèle",   c:"var(--st-fidele)"},
  nouvelle: {label:"Nouvelle", c:"var(--st-nouvelle)"},
  attention:{label:"À surveiller", c:"var(--st-attention)"}
};
const DEFAULT_CATALOGUE = {
  prestations:[
    {nom:"Gel X", prix:55, duree:90},
    {nom:"Gel", prix:50, duree:75},
    {nom:"Semi", prix:35, duree:60},
    {nom:"Gainage", prix:60, duree:60},
    {nom:"Dépose", prix:15, duree:15}
  ],
  options:[
    {nom:"French", prix:5},
    {nom:"Nail art niveau 1", prix:5},
    {nom:"Nail art niveau 2", prix:10},
    {nom:"Nail art niveau 3", prix:15}
  ],
  ouverture:"09:00", fermeture:"19:00",
  regles:"Au-delà de 15 min de retard, je devrai écourter ou décaler la prestation. Merci de prévenir au moins 48h avant en cas d'annulation 🙏",
  signature:"Marie",
  rappel:"Bonjour {prenom} ! Petit rappel de ton rendez-vous demain, {jour}, à {heure} pour {prestation} 💅\nÀ demain !\n{signature}",
  bonneAnnee:"Bonne année {prenom} ! 🥂\nMerci pour ta confiance, j'ai hâte de prendre soin de tes ongles en {annee} ✨\nGros bisous,\n{signature}"
};

const S = {
  db:null, ready:false,
  clients:new Map(), rdvs:[], catalogue:DEFAULT_CATALOGUE, stock:[], depenses:[], attente:[], cartes:[],
  tab:"agenda", half:new Date().getHours()>=13?1:0, day:iso(new Date()), weekStart:null, cal:iso(new Date()).slice(0,7),
  jour:{taches:[],objectifs:[]}, jourPath:null, jourUnsub:null, bilan:false,
  q:"", filtre:"tous", tri:"az", month:iso(new Date()).slice(0,7)
};
S.weekStart = mondayOf(S.day);
const TRI_COURT={az:"A → Z",recent:"Récentes",prochain:"Prochain rdv",ajout:"Ajoutées",fideles:"Visites"};
const ICO_TRI=`<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 3v10M4 13l-2.5-2.5M4 13l2.5-2.5M12 13V3M12 3 9.5 5.5M12 3l2.5 2.5" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const TRIS=[["az","A → Z"],["recent","Vues récemment"],["prochain","Prochain rdv"],["ajout","Ajoutées récemment"],["fideles","Plus de visites"]];
try{const t=localStorage.getItem("carnet-tri");if(TRIS.some(([k])=>k===t))S.tri=t}catch(e){}

/* ---------- utils ---------- */
function pad(n){return String(n).padStart(2,"0")}
function iso(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function parse(s){const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)}
function addDays(s,n){const d=parse(s);d.setDate(d.getDate()+n);return iso(d)}
function mondayOf(s){const d=parse(s);const w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return iso(d)}
function mins(h){const [a,b]=(h||"0:0").split(":").map(Number);return a*60+b}
function hhmm(m){return pad(Math.floor(m/60))+":"+pad(m%60)}
function eur(n){return (Math.round(n*100)/100).toLocaleString("fr-FR",{maximumFractionDigits:2})+" €"}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
const fDay = new Intl.DateTimeFormat("fr-FR",{weekday:"long",day:"numeric",month:"long"});
const fShort = new Intl.DateTimeFormat("fr-FR",{weekday:"short"});
const fMonth = new Intl.DateTimeFormat("fr-FR",{month:"long",year:"numeric"});
const fDate = new Intl.DateTimeFormat("fr-FR",{day:"numeric",month:"short",year:"numeric"});
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}
// Nom complet partout (fiches, listes, messages) ; dans l'agenda seulement, l'initiale du nom
function nomC(c){if(!c)return "Cliente supprimée";const p=(c.prenom||"").trim(),n=(c.nom||"").trim().replace(/^\(.*\)$/,"");return [p,n].filter(Boolean).join(" ")||"Sans nom"}
function nomInit(c){if(!c)return "Cliente supprimée";const p=(c.prenom||"").trim(),n=(c.nom||"").trim().replace(/^\(.*\)$/,"");return (p+(n?" "+n[0].toUpperCase()+".":""))||"Sans nom"}
function initials(c){return c?((c.prenom||"?")[0]+((c.nom||"")[0]||"")).toUpperCase():"?"}
function stC(c){return "var(--choco)"}
function isAbo(c){return !!c&&(c.abonnee===true||(c.abonnee===undefined&&c.statut==="abonnee"))}
function nbPresta(id){const t=iso(new Date());return S.rdvs.filter(r=>r.clientId===id&&(r.statut==="fait"||(r.date<t&&(!r.statut||r.statut==="prevu")))).length}
function niveau(c){if(!c)return "";const n=nbPresta(c.id);return n>=3?"fidele":n<=1?"nouvelle":""}
function tagHTML(c){return ""}
const COURONNE=`<svg viewBox="0 0 20 14" aria-hidden="true"><path d="M2 12.5h16L19 3.2l-5 4.2L10 1 6 7.4 1 3.2Z" fill="currentColor"/></svg>`;
// le prénom en plus doux, le nom de famille bien foncé ; un petit cœur pour les fidèles
function nomHTML(c){if(!c)return "Cliente supprimée";const p=(c.prenom||"").trim(),n=(c.nom||"").trim().replace(/^\(.*\)$/,"");
  return (p?`<span class="${n?"pn":"nn"}">${esc(p)}</span>`:"")+(p&&n?" ":"")+(n?`<span class="nn">${esc(n)}</span>`:"")+(p||n?"":"Sans nom")}
const avClub=c=>isAbo(c)?`<i class="couronne" aria-label="Club Dilerna">${COURONNE}</i>`:"";
function avNew(c){return niveau(c)==="nouvelle"?" estnew":""}
function coeur(c){return ""}
function totalRdv(r){return (r.prestation?.prix||0)+(r.options||[]).filter(o=>!o.offert).reduce((a,o)=>a+(o.prix||0),0)}
function offertRdv(r){return (r.options||[]).filter(o=>o.offert).reduce((a,o)=>a+(o.prix||0),0)}
function extrasRdv(r){return (r.options||[]).filter(o=>!o.offert).reduce((a,o)=>a+(o.prix||0),0)}
function toast(t){const el=document.createElement("div");el.className="toast";el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),2200)}
async function write(fn,okMsg){
  if(!S.db){toast("Pas connectée");return false}
  try{await fn();if(okMsg)toast(okMsg);return true}
  catch(e){
    if(e?.code==="unavailable"){await new Promise(r=>setTimeout(r,600+Math.random()*600));try{await fn();if(okMsg)toast(okMsg);return true}catch(e2){}}
    toast(e?.code==="quota_exceeded"?"Stockage plein : supprime d'anciens rendez-vous":"Pas enregistré, vérifie ta connexion");return false}
}

/* ---------- data ---------- */
(async()=>{
  const db = await window.claude?.use?.("db");
  if(!db){S.ready=true;render();return}
  S.db=db;
  db.collection("clientes").onSnapshot(snap=>{
    S.clients=new Map(snap.docs.map(d=>[d.id,{id:d.id,...d.data()}]));S.ready=true;render();
  },()=>{});
  db.collection("rdv").orderBy("date","desc").limit(1000).onSnapshot(snap=>{
    S.rdvs=snap.docs.map(d=>({id:d.id,...d.data()}));render();
  },()=>{});
  // stock, dépenses, liste d'attente, cartes cadeaux : une collection chacune
  for(const k of ["attente"])db.collection(k).onSnapshot(snap=>{S[k]=snap.docs.map(d=>({id:d.id,...d.data()}));render()},()=>{});
  db.doc("reglages/catalogue").onSnapshot(s=>{
    if(s.exists){S.catalogue={...DEFAULT_CATALOGUE,...s.data()};render()}
  },()=>{});
})();

/* ---------- render ---------- */
const V=document.getElementById("view");
// Dans le cadre iPhone, la barre du bas sort de la partie qui défile (sinon elle descend avec la liste)
{const scr=document.querySelector(".screen"),nav=document.querySelector("nav.tabs");if(scr&&nav)scr.appendChild(nav)}
function render(){
  document.querySelectorAll("nav.tabs button").forEach(b=>b.classList.toggle("on",b.dataset.tab===S.tab||(b.dataset.tab==="agenda"&&S.tab==="jour")));
  const ad=document.getElementById("btnAdd");if(ad)ad.textContent=S.tab==="clientes"?"+ Cliente":"+ Rdv";
  majCloche();
  if(S.tab==="agenda") V.innerHTML=renderSemaine();
  else if(S.tab==="jour"){subJour(S.day);V.innerHTML=renderJour()}
  else if(S.tab==="bilan") V.innerHTML=renderBilan();
  else V.innerHTML=renderClientes();
  if(S.tab==="agenda"){centrerJours();requestAnimationFrame(fitWeek)}
  const qi=document.getElementById("q"); if(qi&&S._focusQ){qi.focus();qi.setSelectionRange(qi.value.length,qi.value.length)}
  // Dans le cadre iPhone (ordinateur), la colonne A → Z se pose sur l'écran, sinon elle défilerait avec la liste
  const scr=document.querySelector(".screen");if(scr&&innerWidth>600){scr.querySelectorAll(":scope>.azbar,:scope>.azpop").forEach(x=>x.remove());V.querySelectorAll(".azbar,.azpop").forEach(x=>scr.appendChild(x))}
}

function rdvsOf(day){return S.rdvs.filter(r=>r.date===day).sort((a,b)=>mins(a.heure)-mins(b.heure))}

const WD=["L","M","M","J","V","S","D"];
const JC=["lun.","mar.","mer.","jeu.","ven.","sam.","dim."];
function court(n){n=String(n||"");const m=n.match(/niveau\s*(\d)/i);if(m)return "NA"+m[1];
  if(/^remplissage/i.test(n))return "Remp";if(/^french/i.test(n))return "Fr";if(/^d[ée]pose/i.test(n))return "Dép.";
  return n.length<=6?n:n.split(" ")[0]}
function nomCourt(c){return c?nomInit(c).toUpperCase():"?"}
function prestaCourte(r){return [court(r.prestation?.nom),...(r.options||[]).map(o=>court(o.nom))].filter(Boolean).join("+")}
// toutes les clientes en clair, le perso en marron moyen, les créneaux bloqués en marron foncé
const estPause=r=>!!r.perso&&!r.bloque&&(r.label||"Pause déj")==="Pause déj";
function ton(r){const k=r.perso?(r.bloque?0:2):1;return "--tb:var(--b"+k+");--tf:var(--b"+k+"f)"}
function occupation(day){return rdvsOf(day).filter(r=>r.statut!=="annule"&&r.statut!=="lapin").reduce((a,r)=>a+(Number(r.duree)||60),0)}

function isoWeek(ds){const d=parse(ds);d.setDate(d.getDate()+3-((d.getDay()+6)%7));const y=new Date(d.getFullYear(),0,4);return 1+Math.round(((d-y)/864e5-3+((y.getDay()+6)%7))/7)}
const WH0=8,WH1=19;let SLOT=24;
function plage(){return [WH0*60,WH1*60]} // toute la journée d'un coup, 8h–19h
// Horaires jour par jour (0 = lundi … 6 = dimanche) et vacances, réglés dans « Ma grille & réglages »
const JOURS_L=["Lun.","Mar.","Mer.","Jeu.","Ven.","Sam.","Dim."];
function horaires(){const c=S.catalogue,h=c.horaires;if(Array.isArray(h)&&h.length===7)return h;
  return JOURS_L.map((_,i)=>({ouvert:i<6,de:c.ouverture||"09:00",a:c.fermeture||"19:00",pDe:"",pA:""}))}
function enVacances(d){return (S.catalogue.vacances||[]).find(v=>v.du<=d&&d<=v.au)}
function jourInfo(d){const i=(parse(d).getDay()+6)%7,h=horaires()[i]||{},v=enVacances(d);
  return {ferme:!!v||!h.ouvert,raison:v?"Vacances":(!h.ouvert?"Fermé":""),de:mins(h.de||"09:00"),a:mins(h.a||"19:00"),pDe:h.pDe&&h.pA?mins(h.pDe):null,pA:h.pDe&&h.pA?mins(h.pA):null}}
const hTxt=v=>{const [h,m]=String(v||"").split(":");return +h+"h"+(m&&m!=="00"?m:"")};
function renderSemaine(){
  const today=iso(new Date()), ws=mondayOf(S.day), we=addDays(ws,6);
  const sameM=ws.slice(0,7)===we.slice(0,7);
  const mL=new Intl.DateTimeFormat("fr-FR",{month:"long"}), mS=new Intl.DateTimeFormat("fr-FR",{month:"short"});
  const titre=(sameM?cap(mL.format(parse(we))):cap(mS.format(parse(ws)).replace(".",""))+" – "+mS.format(parse(we)).replace(".",""))+`<span class="yr num">${parse(we).getFullYear()}</span>`;
  const plg=sameM?`du ${parse(ws).getDate()} au ${parse(we).getDate()} ${mL.format(parse(we))}`:`du ${parse(ws).getDate()} ${mL.format(parse(ws))} au ${parse(we).getDate()} ${mL.format(parse(we))}`;
  const [A,B]=plage(), N=(B-A)/30;
  // combien de rdv dans chaque demi-journée, pour ne jamais en rater un
  const actifsDe=d=>rdvsOf(d).filter(r=>r.statut!=="annule"&&!r.perso);
  const estMatin=r=>mins(r.heure)<13*60, estAprem=r=>mins(r.heure)+(Number(r.duree)||60)>13*60;
  let nM=0,nA=0;for(let i=0;i<7;i++)for(const r of actifsDe(addDays(ws,i))){if(estMatin(r))nM++;if(estAprem(r))nA++}
  const cnt=n=>n?`<span class="cnt num">${n}</span>`:"";
  let h=`<div class="wkhead"><button class="iconbtn" data-act="wstep" data-n="-7" aria-label="Semaine précédente">‹</button>
    <button type="button" class="mlabel" data-act="mois" aria-label="Voir tout le mois"><b>${titre}<span class="mfleche">▾</span></b><small class="num">${plg}</small></button>
    <button class="iconbtn" data-act="wstep" data-n="7" aria-label="Semaine suivante">›</button></div>
`;
  // anniversaires du jour et rappels de demain : rangés dans la clochette « À faire » en haut à droite
  const nowD=new Date(),nowM=nowD.getHours()*60+nowD.getMinutes(),ici=t=>nowM>=t&&nowM<t+30; // la demi-heure où on est
  h+=`<div class="wview" id="wview"><div class="${S.wanim||""}">`;
  // bande des jours : on la fait glisser au doigt pour voir les semaines d'avant et d'après (8 de chaque côté)
  const PAGES=8;
  h+=`<div class="wgrid"><div></div><div class="dscroll" id="dscroll" data-pages="${PAGES}" aria-label="Jours, fais glisser pour changer de semaine">`;
  for(let p=-PAGES;p<=PAGES;p++){const w0=addDays(ws,p*7);h+=`<div class="dweek">`;
  for(let i=0;i<7;i++){const d=addDays(w0,i),n=actifsDe(d).length;
    h+=`<button type="button" class="wday ${d===today?"today":""} ${d===S.day?"sel":""}" data-act="selDay" data-d="${d}" aria-pressed="${d===S.day}" aria-label="${fDay.format(parse(d))}${n?", "+n+" rendez-vous":""}"><span class="l">${JC[i]}</span><span class="n num">${parse(d).getDate()}</span><span class="c">${n?n+" rdv":""}</span></button>`}
  h+=`</div>`}
  h+=`</div></div>`;
  const JW=jourInfo(addDays(ws,1));
  h+=`<div class="wgrid" id="wbody" data-a="${A}" style="--s:${SLOT}px;height:${N*SLOT}px;margin-top:4px"><div class="wtimes">`;
  for(let k=0;k<N;k++){const m=A+k*30;h+=`<span class="num ${m%60?"":"full"} ${ws<=today&&today<=addDays(ws,6)&&ici(m)?"maint":""} ${JW.pDe!=null&&m>=JW.pDe&&m<JW.pA?"lunch":""}" style="top:${k*SLOT}px">${m%60?"30":Math.floor(m/60)+"H"}</span>`}
  h+=`</div>`;
  for(let i=0;i<7;i++){
    const d=addDays(ws,i), list=rdvsOf(d), J=jourInfo(d);
    h+=`<div class="wcol ${i>=5?"we":""} ${d===S.day?"sel":""} ${J.ferme?"fermee":""}" data-d="${d}">${J.ferme?`<div class="fermetag">${J.raison}</div>`:""}`;
    for(let k=0;k<N;k++){const m=A+k*30,hm=hhmm(m);
      h+=`<button class="wcell ${k%2?"h":""} ${d===today&&ici(m)?"maintenant":""} ${!J.ferme&&J.pDe!=null&&m>=J.pDe&&m<J.pA?"lunch":""} ${!J.ferme&&(m<J.de||m>=J.a)?"hors":""}" style="top:${k*SLOT}px;height:${SLOT}px" data-act="cell" data-d="${d}" data-m="${m}" aria-label="${fDay.format(parse(d))} à ${hm.replace(":","h")}"></button>`}
    const ls=Math.max(J.pDe??0,A),le=Math.min(J.pA??0,B);if(!J.ferme&&le>ls)h+=`<div class="lunchtag" style="top:${(ls-A)/30*SLOT+(le-ls)/60*SLOT-6}px">pause</div>`;
    const ev=list.map(r=>({r,s:mins(r.heure),e:mins(r.heure)+(Number(r.duree)||60),col:0,cols:1}));
    const groups=[];let g=null;
    for(const x of ev){if(g&&x.s<g.end){g.items.push(x);g.end=Math.max(g.end,x.e)}else{g={items:[x],end:x.e};groups.push(g)}}
    for(const gr of groups){const ends=[];for(const x of gr.items){let c=ends.findIndex(e=>e<=x.s);if(c<0){c=ends.length;ends.push(x.e)}else ends[c]=x.e;x.col=c}for(const x of gr.items)x.cols=ends.length}
    for(const x of ev){
      const s0=Math.max(x.s,A),e0=Math.min(x.e,B);if(e0<=s0)continue;
      const top=(s0-A)/30*SLOT, ht=Math.max(18,(e0-s0)/30*SLOT-2), c=S.clients.get(x.r.clientId);
      const w=100/x.cols;
      h+=`<button class="wblk ${x.r.perso?"perso":""} ${estPause(x.r)?"pausedej":""} ${x.r.statut==="annule"||x.r.statut==="lapin"?"cancel":""} ${x.r.statut==="fait"?"done":""}" style="${ton(x.r)};top:${top+1}px;height:${ht}px;left:calc(${w*x.col}% + 1px);right:auto;width:calc(${w}% - 2px)" data-act="editRdv" data-id="${x.r.id}" data-s="${x.s}" aria-label="${esc(x.r.heure)} ${esc(nomC(c))} ${esc(x.r.prestation?.nom||"")}">
        <span class="dropto num"></span><span class="t num">${esc(x.r.heure.replace(/^0/,"").replace(":","h"))}</span><span class="w">${x.r.perso?esc(estPause(x.r)?"PAUSE":x.r.bloque?"BLOQUÉ":(x.r.label||"PERSO")).toUpperCase():(isAbo(c)?'<i class="hk">♥</i>':"")+esc(nomCourt(c))}</span>${ht>=40&&!x.r.perso?`<span class="pr ${ht<70?"one":""}">${esc(prestaCourte(x.r))}</span>`:""}</button>`;
    }
    h+=`</div>`;
  }
  h+=`</div></div></div>`;

  for(const o of r.options||[]) if(!allOpts.some(a=>a.nom===o.nom)) allOpts.push({nom:o.nom,prix:o.prix});

    return `<label class="opt"><input type="checkbox" id="opt${i}" data-i="${i}" ${cur?"checked":""}><span>${esc(o.nom)}</span><span class="p num">${eur(prix)}</span><button type="button" class="gift ${cur?.offert?"on":""}" data-gift="${i}" ${cur?"":"disabled"}>🎁 offert</button></label>`}).join("");

  openSheet(`
    <div class="sheet-h"><h3>${isNew?"Nouveau rdv":"Rendez-vous"}</h3><div class="sheet-tools"><button type="button" class="plusbtn" id="btnNewCli" aria-label="Nouvelle cliente">+ Cliente</button></div></div>
    <form class="f" id="fRdv">
      <div class="fld" id="cliField"><label for="rCliQ">Cliente</label><div class="ac" style="--c:${r.clientId?stC(S.clients.get(r.clientId)):"var(--line)"}"><span class="dot"></span><input id="rCliQ" value="${esc(S.clients.get(r.clientId)?nomC(S.clients.get(r.clientId)):"")}" placeholder="Tape les premières lettres…" autocomplete="off" autocapitalize="words"><div class="acl" id="acl" hidden></div></div></div>
      <input type="hidden" id="rClient" value="${esc(r.clientId)}">
      <div id="lastBox" hidden></div>
      <div id="quickNew" hidden><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><span class="label">Nouvelle cliente</span><button type="button" class="link" id="backCli">← Retour</button></div><div class="two">
        <div class="fld"><label for="qPrenom">Prénom</label><input id="qPrenom" autocomplete="off" autocapitalize="words"></div>
        <div class="fld"><label for="qTel">Téléphone</label><input id="qTel" type="tel" autocomplete="off"></div>
      </div></div>
      <div class="three">
        <div class="fld"><label for="rDate">Date</label><input id="rDate" type="date" value="${r.date}" required></div>
        <div class="fld"><label for="rHeure">Heure</label><input id="rHeure" type="time" step="900" value="${r.heure}" required></div>
        <div class="fld"><label for="rDuree">Durée (min)</label><input id="rDuree" type="number" inputmode="numeric" min="15" step="15" value="${r.duree}"></div>
      </div>
      <div class="quick" id="quick" aria-label="Raccourcis de date">${[["Aujourd'hui",0],["+1 sem",7],["+2 sem",14],["+3 sem",21],["+4 sem",28],["+6 sem",42]].map(([l,n])=>`<button type="button" data-plus="${n}">${l}</button>`).join("")}</div>
      <div class="dhint" id="dHint"></div>
      <div class="fld"><label for="rPrest">Prestation</label><select id="rPrest"><option value="">Choisir…</option>${prestOpts}</select></div>
      <div class="fld" hidden><label>Options</label><div class="opts" id="opts">${optsHtml}</div></div>
      <div class="total"><span><small>Total annoncé à la cliente</small><b class="num" id="tot">0 €</b></span><span id="offTxt" style="font-size:13px;text-align:right"></span></div>
      <div class="fld"><label for="rNote">Note pour ce rdv</label><textarea id="rNote" placeholder="Couleur choisie, inspi, forme…">${esc(r.note||"")}</textarea></div>
      ${isNew?"":`<div class="fld"><label>Statut</label><div class="seg" id="seg">
        ${[["prevu","Prévu","var(--choco)"],["fait","Fait","var(--ok)"],["lapin","Lapin","var(--bad)"],["annule","Annulé","var(--muted)"]].map(([k,l,c])=>`<button type="button" data-st="${k}" style="--c:${c}" class="${(r.statut||"prevu")===k?"on":""}">${l}</button>`).join("")}
      </div></div>
      <div class="fld"><label>Encaisser</label><div class="paie" id="paie"></div></div>`}
      <button class="btn" type="submit">${isNew?"Enregistrer le rendez-vous":"Enregistrer"}</button>
      <button class="btn ghost" type="button" id="btnMsg">Préparer le message de confirmation</button>
      <div id="msgBox" hidden></div>
      ${isNew?"":`<button class="btn ghost" type="button" id="btnNext">↻ Reprendre un rdv dans 3 semaines</button>`}
      ${isNew?"":`<button class="btn danger" type="button" id="btnDel">Supprimer ce rendez-vous</button><div id="delBox"></div>`}
    </form>`, sheet=>{
    const $=s=>sheet.querySelector(s);
    const state={opts:allOpts.map(o=>{const cur=(r.options||[]).find(x=>x.nom===o.nom);return cur?{...cur,on:true}:{nom:o.nom,prix:o.prix,offert:false,on:false}}), statut:r.statut||"prevu"};
    function prest(){const v=$("#rPrest").value;if(v==="keep")return r.prestation;if(v==="")return null;const p=cat.prestations[+v];return {nom:p.nom,prix:p.prix}}
    function build(){return {...r,clientId:$("#rClient").value,date:$("#rDate").value,heure:$("#rHeure").value,duree:Number($("#rDuree").value)||60,
      prestation:prest(),options:state.opts.filter(o=>o.on).map(({nom,prix,offert})=>({nom,prix,offert:!!offert})),statut:state.statut,note:$("#rNote").value.trim()}}
    function upd(){const b=build();
      if(b.date){const autres=S.rdvs.filter(x=>x.id!==r.id&&x.date===b.date&&x.statut!=="annule");$("#dHint").innerHTML=`${cap(fDay.format(parse(b.date)))} · <b>${autres.length?autres.length+" autre"+(autres.length>1?"s":"")+" rdv ce jour-là ("+autres.map(x=>x.heure).sort().join(", ")+")":"journée libre"}</b>`}$("#tot").textContent=eur(totalRdv(b));const off=offertRdv(b);$("#offTxt").innerHTML=off?`🎁 ${eur(off)} offerts`:"";$("#msgBox").hidden=true}
    const norm=x=>String(x||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
    function lastOf(id){const t=iso(new Date());const l=S.rdvs.filter(x=>x.clientId===id&&x.id!==r.id&&x.statut!=="annule"&&x.prestation).sort((a,b)=>(b.date+b.heure).localeCompare(a.date+a.heure));return l.find(x=>x.date<=t)||l[0]}
    function applyLast(l){
      const pi=cat.prestations.findIndex(p=>p.nom===l.prestation.nom);
      if(pi>=0){$("#rPrest").value=String(pi);$("#rDuree").value=l.duree||cat.prestations[pi].duree||60}
      state.opts.forEach((o,i)=>{const m=(l.options||[]).find(x=>x.nom===o.nom);o.on=!!m;o.offert=false;
        const cb=sheet.querySelector("#opt"+i),g=sheet.querySelector(`[data-gift="${i}"]`);if(cb)cb.checked=o.on;if(g){g.disabled=!o.on;g.classList.remove("on")}});
      upd()}
    function showLast(id){const l=lastOf(id),box=$("#lastBox");if(!l||!isNew){box.hidden=true;return}
      const txt=[l.prestation.nom,...(l.options||[]).map(o=>o.nom)].join(" + ");
      box.hidden=false;box.innerHTML=`<button type="button" class="btn ghost" id="sameBtn" style="min-height:44px">↻ Comme la dernière fois : ${esc(txt)}</button>`;
      box.querySelector("#sameBtn").onclick=()=>{applyLast(l);toast("Prestation reprise ✨")};
      if(!$("#rPrest").value)applyLast(l)}
    function pickCli(id){const c=S.clients.get(id);$("#rClient").value=id;$("#rCliQ").value=nomC(c);sheet.querySelector(".ac").style.setProperty("--c",stC(c));$("#acl").hidden=true;showLast(id);upd()}
    function newCli(prenom){$("#rClient").value="__new";$("#cliField").hidden=true;$("#quickNew").hidden=false;$("#qPrenom").value=prenom||"";$("#qPrenom").focus();upd()}
    function suggest(){const q=norm($("#rCliQ").value.trim());const box=$("#acl");
      if(!q){box.hidden=true;return}
      const all=[...S.clients.values()];
      const starts=all.filter(c=>norm(c.prenom).startsWith(q)||norm(c.nom).startsWith(q)||norm(nomC(c)).startsWith(q));
      const cont=all.filter(c=>!starts.includes(c)&&norm(nomC(c)).includes(q));
      const res=[...starts,...cont].sort((a,b)=>nomC(a).localeCompare(nomC(b),"fr")).slice(0,6);
      box.innerHTML=res.map(c=>`<button type="button" data-cli="${c.id}" style="--c:${stC(c)}"><i></i>${isAbo(c)?`<span class="ccour">${COURONNE}</span>`:""}${esc(nomC(c))}<small>${niveau(c)==="nouvelle"?"NEW":""}</small></button>`).join("")+
        `<button type="button" class="new" data-newcli="1">+ Nouvelle cliente « ${esc($("#rCliQ").value.trim())} »</button>`;
      box.hidden=false;
      box.querySelectorAll("[data-cli]").forEach(b=>b.onclick=()=>pickCli(b.dataset.cli));
      box.querySelector("[data-newcli]").onclick=()=>newCli($("#rCliQ").value.trim());
    }
    $("#rCliQ").addEventListener("input",()=>{$("#rClient").value="";sheet.querySelector(".ac").style.setProperty("--c","var(--line)");suggest()});
    $("#rCliQ").addEventListener("focus",()=>{if(!$("#rClient").value)suggest()});
    $("#btnNewCli").onclick=()=>newCli("");
    if(isNew&&r.clientId&&!r.prestation)setTimeout(()=>showLast(r.clientId),0);
    $("#backCli").onclick=()=>{$("#rClient").value="";$("#quickNew").hidden=true;$("#cliField").hidden=false;$("#rCliQ").value="";$("#rCliQ").focus()};
    $("#rPrest").onchange=()=>{const v=$("#rPrest").value;if(v!==""&&v!=="keep")$("#rDuree").value=cat.prestations[+v].duree||60;upd()};
    sheet.querySelectorAll("#opts input[type=checkbox]").forEach(cb=>cb.onchange=()=>{const o=state.opts[+cb.dataset.i];o.on=cb.checked;if(!cb.checked)o.offert=false;
      const g=sheet.querySelector(`[data-gift="${cb.dataset.i}"]`);g.disabled=!cb.checked;g.classList.toggle("on",!!o.offert);upd()});
    sheet.querySelectorAll("[data-gift]").forEach(g=>g.onclick=e=>{e.preventDefault();const o=state.opts[+g.dataset.gift];o.offert=!o.offert;g.classList.toggle("on",o.offert);
      if(o.offert)toast("Sûre ? Un extra offert, c'est "+eur(o.prix)+" en moins 😉");upd()});
    sheet.querySelectorAll("#quick button").forEach(q=>q.onclick=()=>{$("#rDate").value=addDays(iso(new Date()),+q.dataset.plus);upd()});
    if(!isNew)$("#btnNext").onclick=()=>{const opts=(r.options||[]).filter(o=>!o.offert);closeSheet();
      openRdv(null,{clientId:r.clientId,date:addDays(r.date,21),heure:r.heure,duree:r.duree,prestation:r.prestation,options:opts})};
    sheet.querySelectorAll("#seg button").forEach(b=>b.onclick=()=>{state.statut=b.dataset.st;sheet.querySelectorAll("#seg button").forEach(x=>x.classList.toggle("on",x===b))});
    // Encaisser : un geste par moyen de paiement ; le rdv passe en « Fait » et le montant est gardé pour le Bilan
    function dessinePaie(){const p=$("#paie");if(!p)return;
      p.innerHTML=r.paye?`<span class="paye">Payé · ${esc(r.paye.mode)} · ${eur(r.paye.montant)}</span><button type="button" class="link" id="paieX">Annuler</button>`
        :["Espèces","Carte","Virement"].map(m=>`<button type="button" data-mode="${m}">${m}</button>`).join("");
      p.querySelectorAll("[data-mode]").forEach(b=>b.onclick=async()=>{const montant=totalRdv(build()),paye={mode:b.dataset.mode,montant,le:iso(new Date())};
        if(await write(()=>S.db.doc("rdv/"+r.id).update({paye,statut:"fait"}),`Encaissé · ${b.dataset.mode} · ${eur(montant)}`)){r.paye=paye;state.statut="fait";
          sheet.querySelectorAll("#seg button").forEach(x=>x.classList.toggle("on",x.dataset.st==="fait"));dessinePaie()}});
      const x=$("#paieX");if(x)x.onclick=async()=>{if(await write(()=>S.db.doc("rdv/"+r.id).update({paye:null}),"Paiement annulé")){r.paye=null;dessinePaie()}};
    }
    if(!isNew)dessinePaie();
    ["#rDate","#rHeure","#rDuree","#rNote"].forEach(s=>$(s).addEventListener("input",upd));
    upd();

    $("#btnMsg").onclick=()=>{const b=build();let c=S.clients.get(b.clientId);if(b.clientId==="__new")c={prenom:$("#qPrenom").value};
      if(!b.prestation){toast("Choisis d'abord la prestation");return}
      const txt=confirmMsg(b,c);const box=$("#msgBox");box.hidden=false;
      box.innerHTML=`<div class="msg" id="msgTxt">${esc(txt)}</div><div class="actions" style="margin-top:8px"><button type="button" class="btn" id="cp">Copier</button><button type="button" class="btn ghost" id="cpClose">Masquer</button></div>`;
      box.querySelector("#cp").onclick=()=>{navigator.clipboard.writeText(txt).then(()=>toast("Copié, colle-le dans WhatsApp ou SMS ✨"),()=>{const sel=getSelection(),rg=document.createRange();rg.selectNodeContents(box.querySelector("#msgTxt"));sel.removeAllRanges();sel.addRange(rg);toast("Texte sélectionné : fais Copier")})};
      box.querySelector("#cpClose").onclick=()=>{box.hidden=true}};

    if(!isNew){$("#btnDel").onclick=()=>{$("#delBox").innerHTML=`<div class="confirm"><b>Supprimer définitivement ce rendez-vous ?</b><div class="actions"><button type="button" class="btn ghost" id="no">Non</button><button type="button" class="btn" style="background:var(--bad)" id="yes">Supprimer</button></div></div>`;
      $("#no").onclick=()=>{$("#delBox").innerHTML=""};
      $("#yes").onclick=async()=>{if(await write(()=>S.db.doc("rdv/"+r.id).delete(),"Rendez-vous supprimé"))closeSheet()}}}

    $("#fRdv").onsubmit=async e=>{e.preventDefault();const b=build();
      if(!b.clientId){toast("Choisis une cliente dans la liste, ou appuie sur + Cliente");return}
      if(!b.prestation){toast("Choisis une prestation");return}
      if(b.clientId==="__new"){const p=$("#qPrenom").value.trim();if(!p){toast("Indique au moins le prénom");return}
        const ref=S.db?S.db.collection("clientes").doc():null;if(!ref){toast("Pas connectée");return}
        const ok=await write(()=>ref.set({prenom:p,nom:"",tel:$("#qTel").value.trim(),insta:"",statut:"nouvelle",notes:"",allergies:"",creeLe:iso(new Date())}));if(!ok)return;b.clientId=ref.id}
      const conflit=S.rdvs.find(x=>x.id!==r.id&&x.date===b.date&&x.statut!=="annule"&&mins(x.heure)<mins(b.heure)+b.duree&&mins(b.heure)<mins(x.heure)+(Number(x.duree)||60));
      const {id,...body}=b;
      const ok=await write(()=>isNew?S.db.collection("rdv").doc().set(body):S.db.doc("rdv/"+r.id).set(body), conflit?"Enregistré, mais ça chevauche "+nomC(S.clients.get(conflit.clientId)):(isNew?"Rendez-vous ajouté":"Enregistré"));
      if(ok){S.day=b.date;S.cal=b.date.slice(0,7);closeSheet();render()}};
  });
}

function confirmMsg(r,c){
  const d=fDay.format(parse(r.date));
  let t=`Coucou ${c?.prenom||""} 💅\nJe te confirme ton rendez-vous chez Dilerna le ${d} à ${r.heure.replace(":","h")} ✨\n\n`;
  t+=`👉 ${r.prestation.nom} : ${eur(r.prestation.prix)}\n`;
  for(const o of r.options||[]) t+= o.offert?`🎁 ${o.nom} : offert cette fois (au lieu de ${eur(o.prix)})\n`:`➕ ${o.nom} : ${eur(o.prix)}\n`;
  t+=`💰 Total : ${eur(totalRdv(r))}\n\n${S.catalogue.regles}\n\nÀ très vite ! ${S.catalogue.signature||""} 💖`;
  return t;
}

const ALLERGIES=["Cuticules sensibles","Eczéma","Ongles fragiles","Ongles dédoublés","Peau sèche"];
const GOUTTE=`<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.8C6 4.6 3.8 7 3.8 9.6a4.2 4.2 0 0 0 8.4 0C12.2 7 10 4.6 8 1.8Z" fill="currentColor"/></svg>`;
const allergiesListe=v=>String(v||"").split(/\s*·\s*|\s*,\s*/).map(x=>x.trim()).filter(Boolean);
function openClient(c){

      <div class="two"><div class="fld"><label for="cTel">Téléphone</label><input id="cTel" type="tel" value="${esc(c.tel)}" autocomplete="off"></div>

      <label class="abo" for="cAbo"><input type="checkbox" id="cAbo" ${isAbo(c)?"checked":""}><span class="hrt">♥</span><span><b>Cliente abonnée</b><small>Un petit cœur s'affiche devant son prénom</small></span></label>
      <div style="font-size:12.5px;color:var(--muted);margin-top:-4px">« Nouvelle » et « Fidèle » se mettent tout seuls : Nouvelle jusqu'à 1 prestation, Fidèle à partir de 3.</div>
      ${annivChamps(c)}
      ${(()=>{const mes=allergiesListe(c.allergies),autres=mes.filter(t=>!ALLERGIES.includes(t));

        <input id="cAllAutre" placeholder="Autre (facultatif)" autocomplete="off"></div>`})()}
      <div class="fld"><label for="cNotes">Notes</label><textarea id="cNotes" placeholder="Forme préférée, longueur, couleurs, petits détails perso…">${esc(c.notes)}</textarea></div>
      <button class="btn" type="submit">${isNew?"Créer la fiche":"Enregistrer"}</button>
      ${isNew?"":`<button class="btn danger" type="button" id="btnDelC">Supprimer la cliente</button><div id="delC"></div>`}
    </form>`, sheet=>{

    sheet.querySelectorAll("#allPick button").forEach(b=>b.onclick=()=>b.classList.toggle("on"));
    if(!isNew)$("#btnDelC").onclick=()=>{$("#delC").innerHTML=`<div class="confirm"><b>Supprimer ${esc(nomC(c))} ?</b><span style="font-size:13px">Ses rendez-vous resteront dans l'agenda sous « Cliente supprimée ».</span><div class="actions"><button type="button" class="btn ghost" id="no">Non</button><button type="button" class="btn" style="background:var(--bad)" id="yes">Supprimer</button></div></div>`;
      $("#no").onclick=()=>{$("#delC").innerHTML=""};$("#yes").onclick=async()=>{if(await write(()=>S.db.doc("clientes/"+c.id).delete(),"Fiche supprimée"))closeSheet()}};
    $("#fCli").onsubmit=async e=>{e.preventDefault();
      const body={prenom:$("#cPrenom").value.trim(),nom:$("#cNom").value.trim(),tel:$("#cTel").value.trim(),insta:$("#cInsta").value.trim(),abonnee:$("#cAbo").checked,statut:$("#cAbo").checked?"abonnee":"",
        allergies:[...[...sheet.querySelectorAll("#allPick button.on")].map(b=>b.dataset.al),$("#cAllAutre").value.trim()].filter(Boolean).join(" · "),notes:$("#cNotes").value.trim(),anniv:($("#cAnJ").value&&$("#cAnM").value)?$("#cAnM").value+"-"+$("#cAnJ").value:"",annee:Number($("#cAnA").value)||null,annivEnvoye:c.annivEnvoye||null,etiquettes:c.etiquettes||[],aPenser:c.aPenser||[],parrain:c.parrain||"",parlerDe:c.parlerDe||"",reponses:c.reponses||{},creeLe:c.creeLe||iso(new Date())};
      if(c.exemple)body.exemple=true;
      const ref=isNew?S.db?.collection("clientes").doc():S.db?.doc("clientes/"+c.id);
