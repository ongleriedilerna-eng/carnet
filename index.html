/* ---------- anniversaires ---------- */
const MOIS=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const GATEAU=`<svg class="gateau" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5c.9 1.2 1.4 2 1.4 2.7a1.4 1.4 0 0 1-2.8 0c0-.7.5-1.5 1.4-2.7Z" fill="#AB9680"/><rect x="11.2" y="7" width="1.6" height="4" rx=".8" fill="#AB9680"/><rect x="4" y="11" width="16" height="5" rx="2.2" fill="#D8C6B6"/><path d="M4 14.2c1.4 1.2 2.6 1.2 4 0s2.6-1.2 4 0 2.6 1.2 4 0 2.6-1.2 4 0" stroke="#FFFAF5" stroke-width="1.2" fill="none"/><rect x="3" y="16" width="18" height="5.5" rx="2.4" fill="#4E2E22"/></svg>`;
function annivChamps(c){const [m,j]=(c.anniv||"-").split("-");
  return `<div class="fld"><label for="cAnJ">Anniversaire</label><div class="three">
    <select id="cAnJ" aria-label="Jour"><option value="">Jour</option>${Array.from({length:31},(_,i)=>pad(i+1)).map(v=>`<option value="${v}" ${v===j?"selected":""}>${+v}</option>`).join("")}</select>
    <select id="cAnM" aria-label="Mois"><option value="">Mois</option>${MOIS.map((n,i)=>`<option value="${pad(i+1)}" ${pad(i+1)===m?"selected":""}>${n}</option>`).join("")}</select>
    <input id="cAnA" type="number" inputmode="numeric" min="1920" max="2025" placeholder="Année" aria-label="Année (facultatif)" value="${c.annee||""}"></div>
    <small style="font-size:12px;color:var(--muted)">L'année est facultative : sans elle, on souhaite l'anniversaire sans dire l'âge.</small></div>`}
function annivDuJour(){const n=new Date(),md=pad(n.getMonth()+1)+"-"+pad(n.getDate()),an=n.getFullYear();
  return [...S.clients.values()].filter(c=>c.anniv===md&&c.annivEnvoye!==an)}
function deNom(n){return (/^[aeiouyhàâéèêëîïôöûüœ]/i.test(n)?"d'":"de ")+esc(n)}
function ageDe(c){return c.annee?new Date().getFullYear()-c.annee:null}
// Petit bandeau en bas de la semaine, seulement le jour de l'anniversaire, jusqu'à ce que le message soit envoyé
function annivBar(){const l=annivDuJour();if(!l.length)return "";
  return `<div class="annivs">${l.slice(0,2).map(c=>{const a=ageDe(c);return `<div class="annivbar">${GATEAU}<span><b>Anniversaire ${deNom(c.prenom||nomC(c))}</b>${a?` · ${a} ans`:""}</span><button type="button" class="annivgo" data-act="annivMsg" data-id="${c.id}">Lui souhaiter</button></div>`}).join("")}${l.length>2?`<div class="annivplus">+${l.length-2} autre${l.length>3?"s":""} aujourd'hui</div>`:""}</div>`}
function annivTexte(c){return `Joyeux anniversaire ${c.prenom||""} ! 🎂\nJe te souhaite une magnifique journée, pleine de douceur et de belles surprises ✨\nGros bisous,\n${S.catalogue.signature||""}`.trim()}
function openAnniv(id){const c=S.clients.get(id);if(!c)return;const a=ageDe(c),tel=c.tel?telIntl(c.tel):"";
  openSheet(`<div class="sheet-h"><span style="display:flex;align-items:center;gap:10px">${GATEAU.replace('class="gateau"','class="gateau" style="width:30px;height:30px"')}<span><h3 style="margin:0">Anniversaire ${deNom(c.prenom||nomC(c))}</h3><small style="color:var(--muted);font-size:12.5px">${a?a+" ans · ":""}message prêt, tu peux le modifier</small></span></span></div>
    <textarea class="amsg" id="aMsg" aria-label="Message d'anniversaire">${esc(annivTexte(c))}</textarea>
    <div class="aenvoi">${tel?`<a class="wa" id="aWa" target="_blank" rel="noopener">WhatsApp</a><a id="aSms">SMS</a>`:""}<button type="button" id="aCp">Copier</button></div>
    <p style="font-size:12px;color:var(--muted);text-align:center;margin:8px 0 0">${tel?"WhatsApp ou SMS s'ouvre avec le message prêt : il te reste à appuyer sur Envoyer.":"Ajoute son numéro dans sa fiche pour l'envoyer en un geste. En attendant, copie le message."}</p>`,sheet=>{
    const $=s=>sheet.querySelector(s),maj=()=>{const t=encodeURIComponent($("#aMsg").value);if($("#aWa"))$("#aWa").href="https://wa.me/"+tel.replace("+","")+"?text="+t;if($("#aSms"))$("#aSms").href="sms:"+tel+"?&body="+t};
    maj();$("#aMsg").addEventListener("input",maj);
    const fait=()=>{write(()=>S.db.doc("clientes/"+id).update({annivEnvoye:new Date().getFullYear()}));setTimeout(()=>{closeSheet();render()},400)};
    sheet.querySelectorAll(".aenvoi a").forEach(x=>x.addEventListener("click",fait));
    $("#aCp").onclick=()=>{const v=$("#aMsg").value;navigator.clipboard?.writeText(v).then(()=>{toast("Message copié, colle-le dans ta conversation");fait()},()=>{$("#aMsg").select();toast("Texte sélectionné : fais Copier")})??($("#aMsg").select(),toast("Texte sélectionné : fais Copier"))};
  })}
/* ---------- rappels de la veille ---------- */
const ENVEL=`<svg class="gateau" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5.5" width="18" height="13" rx="3" fill="#D8C6B6"/><path d="M4.5 7.5 12 13l7.5-5.5" stroke="#4E2E22" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
function rdvDemain(){const d=addDays(iso(new Date()),1);
  return S.rdvs.filter(r=>r.date===d&&r.clientId&&S.clients.has(r.clientId)&&r.statut!=="annule"&&r.statut!=="lapin").sort((a,b)=>mins(a.heure)-mins(b.heure))}
function rappelBar(){const l=rdvDemain(),reste=l.filter(r=>!r.rappel).length;if(!reste)return "";
  return `<div class="annivs"><div class="annivbar">${ENVEL}<span><b>Rappels de demain</b> · ${reste} cliente${reste>1?"s":""}</span><button type="button" class="annivgo" data-act="rappels">Envoyer</button></div></div>`}
function rappelTexte(r){const c=S.clients.get(r.clientId),f=new Intl.DateTimeFormat("fr-FR",{weekday:"long",day:"numeric",month:"long"});
  const v={prenom:c?.prenom||"",jour:f.format(parse(r.date)),heure:r.heure.replace(/^0/,"").replace(":","h"),prestation:r.prestation?.nom||"ta prestation",signature:S.catalogue.signature||""};
  return (S.catalogue.rappel||DEFAULT_CATALOGUE.rappel).replace(/\{(prenom|jour|heure|prestation|signature)\}/g,(_,k)=>v[k]).trim()}
// « Envoyer à toutes ? » par SMS, comme la maquette n°2 : un seul appui, la barre avance et chaque cliente passe en « Envoyé ».
// Aperçu pour l'instant : aucun SMS ne part vraiment et rien n'est enregistré (le jour où un service SMS sera branché,
// c'est ici qu'on enverra les messages, chacun avec rappelTexte(r)).
function openRappels(){
  const d=addDays(iso(new Date()),1),l=rdvDemain();
  openSheet(`<div class="sheet-h"><h3>Rappels de demain</h3></div>
    <p class="rq">Tu as <b>${l.length} rendez-vous</b> demain, ${fDay.format(parse(d))}. Veux-tu envoyer leur message de rappel par SMS à toutes tes clientes ?</p>
    <div class="rl">${l.map(r=>{const c=S.clients.get(r.clientId);return `<div class="rli" data-r="${r.id}"><span class="av">${esc(initials(c))}</span><span class="rn"><b>${esc(nomC(c))}</b><small>${r.heure.replace(/^0/,"").replace(":","h")} · ${esc(r.prestation?.nom||"")}</small></span><span class="re"><span class="att">à envoyer</span></span></div>`}).join("")}</div>
    <button type="button" class="btn rgo" id="rGo" ${l.length?"":"disabled"}>${l.length?"Envoyer à toutes":"Rien à envoyer"}</button>
    <div class="rprog" hidden><span></span></div>
    <button type="button" class="btn ghost" data-act="close" style="margin-top:8px">Plus tard</button>
    <p class="rpied">Chaque cliente reçoit son SMS avec sa propre heure. Aperçu : pour l'instant, aucun SMS ne part vraiment.</p>`,sheet=>{
    const go=sheet.querySelector("#rGo"),prog=sheet.querySelector(".rprog"),barre=prog.querySelector("span");
    go.onclick=()=>{go.disabled=true;go.textContent="Envoi en cours…";prog.hidden=false;
      l.forEach((r,i)=>setTimeout(()=>{const e=sheet.querySelector(`.rli[data-r="${r.id}"] .re`);if(e)e.innerHTML=`<span class="ok">Envoyé</span>`;
        barre.style.width=((i+1)/l.length*100)+"%";
        if(i===l.length-1){go.classList.add("fini");go.textContent=`Envoyé à ${l.length} cliente${l.length>1?"s":""}`}},500+i*500))};
  })}
/* ---------- bonne année : une fois par an, à toutes les clientes venues ces 3 derniers mois ---------- */
// L'année souhaitée : en janvier celle qui commence, le reste de l'année (aperçu depuis les réglages) la prochaine
const anBA=()=>{const n=new Date();return n.getMonth()===0?n.getFullYear():n.getFullYear()+1};
const enJanvier=()=>{const n=new Date();return n.getMonth()===0&&n.getDate()<=7};
function clientesBA(){const t=iso(new Date()),d=new Date();d.setMonth(d.getMonth()-3);const de=iso(d),ids=new Set();
  for(const r of S.rdvs)if(r.clientId&&!r.perso&&r.statut!=="annule"&&r.date>=de&&r.date<=t&&S.clients.has(r.clientId))ids.add(r.clientId);
  return {de,l:[...ids].map(i=>S.clients.get(i)).sort((a,b)=>nomC(a).localeCompare(nomC(b),"fr"))}}
function baTexte(c){const v={prenom:c?.prenom||"",annee:String(anBA()),signature:S.catalogue.signature||""};
  return (S.catalogue.bonneAnnee||DEFAULT_CATALOGUE.bonneAnnee).replace(/\{(prenom|annee|signature)\}/g,(_,k)=>v[k]).trim()}
// Comme les rappels : un seul appui « Envoyer à toutes » par SMS. Aperçu pour l'instant : aucun SMS ne part vraiment et rien n'est enregistré.
function openBonneAnnee(){const {de,l}=clientesBA(),a=anBA();
  openSheet(`<div class="sheet-h"><h3>Bonne année ${a}</h3></div>
    <p class="rq"><b>${l.length} cliente${l.length>1?"s":""}</b> ${l.length>1?"sont venues":"est venue"} ces 3 derniers mois (depuis le ${esc(fDay.format(parse(de)))}). Veux-tu leur souhaiter une bonne année par SMS ?</p>
    ${l.length?`<div class="note" style="margin-bottom:12px;font-size:14px">${esc(baTexte(l[0]))}</div>`:""}
    <div class="rl">${l.map(c=>`<div class="rli" data-c="${c.id}"><span class="av">${esc(initials(c))}</span><span class="rn"><b>${esc(nomC(c))}</b></span><span class="re"><span class="att">à envoyer</span></span></div>`).join("")}</div>
    <button type="button" class="btn rgo" id="bGo" ${l.length?"":"disabled"}>${l.length?"Envoyer à toutes":"Personne à qui envoyer"}</button>
    <div class="rprog" hidden><span></span></div>
    <button type="button" class="btn ghost" data-act="close" style="margin-top:8px">Plus tard</button>
    <p class="rpied">Chaque cliente reçoit le message avec son prénom. Tu peux changer le texte dans tes réglages. Aperçu : pour l'instant, aucun SMS ne part vraiment.</p>`,sheet=>{
    const go=sheet.querySelector("#bGo"),prog=sheet.querySelector(".rprog"),barre=prog.querySelector("span");
    go.onclick=()=>{go.disabled=true;go.textContent="Envoi en cours…";prog.hidden=false;
      l.forEach((c,i)=>setTimeout(()=>{const e=sheet.querySelector(`.rli[data-c="${c.id}"] .re`);if(e)e.innerHTML=`<span class="ok">Envoyé</span>`;
        barre.style.width=((i+1)/l.length*100)+"%";
        if(i===l.length-1){go.classList.add("fini");go.textContent=`Envoyé à ${l.length} cliente${l.length>1?"s":""}`}},500+i*400))};
  })}
/* ---------- clochette « À faire » : anniversaires du jour + rappels de demain + bonne année (1er au 7 janvier) ---------- */
function aFaire(){const an=annivDuJour(),ra=rdvDemain().filter(r=>!r.rappel),ba=enJanvier()&&clientesBA().l.length>0,sb=[],lib=S.attente.length?placeLiberee():null;
  return {an,ra,ba,sb,lib,n:an.length+ra.length+(ba?1:0)+(sb.length?1:0)+(lib?1:0)}}
function majCloche(){const b=document.getElementById("nbFaire");if(!b)return;const {n}=aFaire();b.hidden=!n;b.textContent=n>9?"9+":String(n)}
function openAFaire(){const {an,ra,ba,sb}=aFaire(),d=addDays(iso(new Date()),1),auj=iso(new Date());
  const rj=rdvsOf(auj).filter(r=>!r.perso&&r.clientId&&r.statut!=="annule"&&r.statut!=="lapin");
  let h=`<div class="sheet-h"><h3>À faire</h3></div>`;
  if(rj.length||an.length)h+=`<div class="label" style="margin:4px 0 6px">Aujourd'hui</div>`;
  if(rj.length)h+=`<div class="card afrdv">${rj.map(r=>{const c=S.clients.get(r.clientId);return `<button type="button" class="row" data-act="editRdv" data-id="${r.id}"><b class="num">${esc(r.heure.replace(/^0/,"").replace(":","h"))}</b><span class="afn">${nomHTML(c)}</span><span class="afp">${esc(r.prestation?.nom||"")}</span></button>`}).join("")}</div>`;
  if(an.length)h+=an.map(c=>{const a=ageDe(c);return `<div class="fcarte"><div class="ft">${GATEAU}<span><b>Anniversaire ${deNom(c.prenom||nomC(c))}</b><small>${a?a+" ans · ":""}message prêt avec son prénom</small></span></div><button type="button" class="btn" data-act="annivMsg" data-id="${c.id}">Lui souhaiter</button></div>`}).join("");
  if(ra.length)h+=`<div class="label" style="margin:14px 0 6px">Ce soir</div><div class="fcarte"><div class="ft">${ENVEL}<span><b>Rappels de demain</b><small>${ra.length} cliente${ra.length>1?"s":""} · ${fDay.format(parse(d))}</small></span></div><button type="button" class="btn" data-act="rappels">Envoyer à toutes</button></div>`;
  if(ba){const n=clientesBA().l.length;h+=`<div class="label" style="margin:14px 0 6px">Nouvelle année</div><div class="fcarte"><div class="ft">${ENVEL}<span><b>Bonne année ${anBA()}</b><small>${n} cliente${n>1?"s":""} venue${n>1?"s":""} ces 3 derniers mois</small></span></div><button type="button" class="btn" data-act="bonneAnnee">Envoyer à toutes</button></div>`}
  if(!rj.length&&!an.length&&!ra.length&&!ba&&!sb.length)h+=`<div class="empty"><b>Rien à faire pour l'instant</b>Tes rendez-vous du jour, les anniversaires, les rappels de demain et la bonne année (début janvier) s'afficheront ici.</div>`;
  h+=`<div id="att"></div>`;
  openSheet(h,montAttente)}
// Fiche cliente : liens Instagram et téléphone
function instaNom(v){v=String(v||"").trim();const m=v.match(/instagram\.com\/([^/?#\s]+)/i);return (m?m[1]:v).replace(/^@+/,"").replace(/\s+/g,"")}
function instaURL(v){return "https://www.instagram.com/"+encodeURIComponent(instaNom(v))+"/"}
function telIntl(v){let d=String(v||"").replace(/[^\d+]/g,"");if(d.startsWith("00"))d="+"+d.slice(2);else if(/^0\d{9}$/.test(d))d="+33"+d.slice(1);return d}

function montEtiq(sh,id){const box=sh.querySelector("#etiq");if(!box)return;let ed=-1,dec=0,anim=false,autre=false,plus=false,fixe="";const passe=new Set();

  // les idées qui suivent la dernière étiquette, puis les autres par paquets de 8
  function idees(l){const pris=new Set(l.map(e=>e.t)),der=l[l.length-1],suite=(der&&ETQ_SUITE[der.t]||[]).filter(t=>!pris.has(t));
    const reste=ETQ.filter(t=>!pris.has(t)&&!suite.includes(t)),n=reste.length,lot=[];

      ${plus?`${suite.length?`<div class="fsugg fsuite">${suite.map(t=>`<button type="button" data-etadd="${esc(t)}">${esc(t)} ?</button>`).join("")}</div>`:""}
      <div class="fsugg">${lot.map(t=>`<button type="button" data-etadd="${esc(t)}">+ ${esc(t)}</button>`).join("")}${n>8?`<button type="button" class="fplus" data-etmore>Autres idées</button>`:""}<button type="button" class="fplus" data-etautre>+ Autre…</button></div>

    box.querySelector("[data-eplus]")?.addEventListener("click",()=>{plus=true;dessine()});

  }

// « Pour la prochaine fois » : ce qu'il faut penser à faire à sa prochaine pose, coché quand c'est fait

  const sauver=l=>{const x=c();if(x)x.aPenser=l;write(()=>S.db.doc("clientes/"+id).update({aPenser:l}))};
  function dessine(){const l=liste(),pris=new Set(l.map(x=>x.t)),idees=PENSER_IDEES.filter(t=>!pris.has(t));
    box.innerHTML=`<div class="label">Pour la prochaine fois</div>
      ${l.length?`<div class="pbox">${l.map((x,i)=>`<div class="penser ${x.fait?"fait":""}"><button type="button" data-p="${i}"><span class="case">${x.fait?"✓":""}</span><span class="ptxt">${esc(x.t)}${x.le?`<small>noté le ${esc(fJM.format(parse(x.le)))}</small>`:""}</span></button><button type="button" class="x" data-px="${i}" aria-label="Retirer">×</button></div>`).join("")}</div>`:""}

// « Elle est venue grâce à » (dans les Notes) : chaque cliente garde qui l'a envoyée (champ parrain)
function montCopines(sh,id){const box=sh.querySelector("#copines");if(!box)return;let cherche=null,q="",merci=false;
  const ligne=(x,retirer)=>`<div class="copine"><button type="button" class="copine" style="border:0;padding:0;flex:1;min-width:0" data-voir="${x.id}"><span class="mini">${esc(initials(x))}</span><span><b>${esc(nomC(x))}</b><small>${(()=>{const v=clientStats(x.id).visites;return v+" visite"+(v>1?"s":"")})()}</small></span></button>${retirer?`<button type="button" class="x" data-cx="${x.id}" aria-label="Retirer">×</button>`:""}</div>`;
  const lier=(qui,parrain)=>{const x=S.clients.get(qui);if(!x)return;x.parrain=parrain;write(()=>S.db.doc("clientes/"+qui).update({parrain}));cherche=null;q="";dessine()};
  function dessine(){const c=S.clients.get(id);if(!c)return;
    const filles=[...S.clients.values()].filter(x=>x.parrain===id&&x.id!==id).sort((a,b)=>nomC(a).localeCompare(nomC(b),"fr"));
    const par=c.parrain&&S.clients.get(c.parrain);
    const res=cherche?[...S.clients.values()].filter(x=>x.id!==id&&!(cherche==="fille"&&x.parrain===id)&&normN(nomC(x)).includes(normN(q))).sort((a,b)=>nomC(a).localeCompare(nomC(b),"fr")).slice(0,6):[];
    const tel=c.tel?telIntl(c.tel):"",txt=`Coucou ${c.prenom||""} ! Merci de m'avoir envoyé ${filles.map(x=>x.prenom||nomC(x)).join(" et ").replace(/ et (?=.* et )/g,", ")}, ça me touche beaucoup.\n${S.catalogue.signature||""}`.trim();
    const ptel=par&&par.tel?telIntl(par.tel):"",ptxt=par?`Coucou ${par.prenom||""} ! Merci de m'avoir envoyé ${c.prenom||nomC(c)}, ça me touche beaucoup.\n${S.catalogue.signature||""}`.trim():"";
    box.innerHTML=`
      <div class="label">Elle est venue grâce à</div>
      ${par?`<div class="pbox">${ligne(par,false).replace('</div>',`<button type="button" class="x" data-cpx aria-label="Retirer">×</button></div>`)}</div>`:cherche==="par"?"":`<div class="fsugg"><button type="button" data-cadd="par">+ Choisir une cliente</button></div>`}
      ${par&&!cherche?`<div class="fsugg"><button type="button" class="fplus" data-merci>Lui dire merci</button></div>`:""}
      ${merci&&par?`<div class="merci"><span style="white-space:pre-line">${esc(ptxt)}</span><div class="aenvoi">${ptel?`<a id="mSms" href="sms:${esc(ptel)}?&body=${encodeURIComponent(ptxt)}">SMS</a>`:""}<button type="button" id="mCp">Copier</button></div></div>`:""}
      ${cherche==="par"?zone():""}`;
    function zone(){return `<div class="cherche"><input class="bnote" id="cQ" value="${esc(q)}" placeholder="Rechercher une cliente" autocomplete="off">${res.length?`<div class="res">${res.map(x=>`<button type="button" class="copine" data-cpick="${x.id}"><span class="mini">${esc(initials(x))}</span><span><b>${esc(nomC(x))}</b></span></button>`).join("")}</div>`:`<div class="vide">Aucune cliente trouvée.</div>`}<button type="button" class="link" data-cno style="align-self:flex-start">Annuler</button></div>`}
    box.querySelectorAll("[data-cadd]").forEach(b=>b.onclick=()=>{cherche=b.dataset.cadd;q="";dessine();box.querySelector("#cQ")?.focus()});
    const iq=box.querySelector("#cQ");if(iq)iq.oninput=()=>{q=iq.value;const p=iq.selectionStart;dessine();const n=box.querySelector("#cQ");n.focus();n.setSelectionRange(p,p)};
    box.querySelectorAll("[data-cpick]").forEach(b=>b.onclick=()=>cherche==="fille"?lier(b.dataset.cpick,id):lier(id,b.dataset.cpick));
    box.querySelector("[data-cno]")?.addEventListener("click",()=>{cherche=null;dessine()});
    box.querySelectorAll("[data-cx]").forEach(b=>b.onclick=()=>lier(b.dataset.cx,""));
    box.querySelector("[data-cpx]")?.addEventListener("click",()=>lier(id,""));
    box.querySelectorAll("[data-voir]").forEach(b=>b.onclick=()=>openFiche(b.dataset.voir,"notes"));
    box.querySelector("[data-merci]")?.addEventListener("click",()=>{merci=!merci;dessine()});
    box.querySelector("#mCp")?.addEventListener("click",()=>{navigator.clipboard?.writeText(ptxt).then(()=>toast("Message copié"),()=>toast("Copie impossible ici"))??toast("Copie impossible ici")})}
  dessine()}

const fBulle=new Intl.DateTimeFormat("fr-FR",{weekday:"short",day:"numeric",month:"short"});
function comboKey(r){return [r.prestation?.nom,...(r.options||[]).map(o=>o.nom).sort()].join("|")}
// La prestation qu'elle prend le plus souvent (à égalité : la plus récente), au prix de la grille actuelle.
// Sans les options : Marie les ajoute elle-même dans la fiche complète.
function habitude(id){
  const t=iso(new Date()),tous=S.rdvs.filter(x=>x.clientId===id&&x.prestation&&x.statut!=="annule").sort((a,b)=>(b.date+b.heure).localeCompare(a.date+a.heure));
  const passes=tous.filter(x=>x.date<=t),l=passes.length?passes:tous;
  if(!l.length)return null;
  const n=new Map();for(const r of l){const k=r.prestation.nom;n.set(k,(n.get(k)||0)+1)}
  let best=l[0],bn=0;for(const r of l){const c=n.get(r.prestation.nom);if(c>bn){bn=c;best=r}}
  const cat=S.catalogue,p=cat.prestations.find(x=>x.nom===best.prestation.nom);
  const memes=l.filter(r=>r.prestation.nom===best.prestation.nom&&!(r.options||[]).length);
  return {prestation:{nom:best.prestation.nom,prix:p?p.prix:best.prestation.prix},options:[],
    duree:p?.duree||Number((memes[0]||best).duree)||60,fois:bn};
}
function recentes(){
  const last=new Map();for(const r of S.rdvs)if(r.clientId&&(last.get(r.clientId)||"")<r.date)last.set(r.clientId,r.date);
  return [...S.clients.values()].sort((a,b)=>(last.get(b.id)||b.creeLe||"").localeCompare(last.get(a.id)||a.creeLe||"")).slice(0,4);
}

// La cliente qu'on propose d'office : celle au salon en ce moment (rdv en cours ou fini depuis moins de 30 min),
// sinon la dernière venue aujourd'hui, sinon la prochaine attendue aujourd'hui, sinon la dernière cliente vue.
function clienteProbable(){
  const n=new Date(),t=iso(n),m=n.getHours()*60+n.getMinutes(),hh=x=>x.replace(/^0/,"").replace(":","h");
  const ok=x=>x.clientId&&S.clients.has(x.clientId)&&x.statut!=="annule"&&x.statut!=="lapin";
  const auj=S.rdvs.filter(x=>ok(x)&&x.date===t).sort((a,b)=>mins(a.heure)-mins(b.heure));
  const enCours=auj.find(x=>m>=mins(x.heure)&&m<mins(x.heure)+(Number(x.duree)||60)+30);
  if(enCours)return {id:enCours.clientId,etiq:"En ce moment au salon"};
  const avant=auj.filter(x=>mins(x.heure)<=m).pop();
  if(avant)return {id:avant.clientId,etiq:"Venue aujourd'hui à "+hh(avant.heure)};
  const apres=auj.find(x=>mins(x.heure)>m);
  if(apres)return {id:apres.clientId,etiq:"Attendue aujourd'hui à "+hh(apres.heure)};
  const passe=S.rdvs.filter(x=>ok(x)&&x.date<t).sort((a,b)=>(b.date+b.heure).localeCompare(a.date+a.heure))[0];
  if(passe)return {id:passe.clientId,etiq:"Dernière cliente · "+fDate.format(parse(passe.date)).replace(/ \d{4}$/,"")};
  const futur=S.rdvs.filter(x=>ok(x)&&x.date>t).sort((a,b)=>(a.date+a.heure).localeCompare(b.date+b.heure))[0];
  if(futur)return {id:futur.clientId,etiq:"Prochaine cliente · "+fDate.format(parse(futur.date)).replace(/ \d{4}$/,"")};
  return null;
}

// Fermer une feuille en la faisant glisser vers le bas, au doigt ou à la souris
let gl=null;
function glDebut(t,x,y){const sh=t.closest?.(".scrim .sheet");if(!sh||t.closest("input,textarea,select,.gzone,.dscroll,.filters"))return;
  if(sh.scrollTop>2&&!t.closest(".grab,.sheet-h"))return;gl={sh,x,y,dy:0,moved:false}}
function glBouge(x,y){if(!gl)return false;const dy=y-gl.y,dx=x-gl.x;
  if(!gl.moved){if(Math.abs(dy)<8&&Math.abs(dx)<8)return false;if(dy<0||Math.abs(dx)>Math.abs(dy)){gl=null;return false}gl.moved=true;gl.sh.style.transition="none"}
  gl.dy=Math.max(0,dy);gl.sh.style.transform=`translateY(${gl.dy}px)`;gl.sh.parentElement.style.background=`rgba(20,10,22,${Math.max(0,.45-gl.dy/900).toFixed(3)})`;return true}
function glFin(){if(!gl)return;const {sh,dy,moved}=gl;gl=null;if(!moved)return;
  sh.style.transition="transform .2s ease-out";
  if(dy>90){sh.style.transform="translateY(110%)";setTimeout(closeSheet,180)}else{sh.style.transform="";sh.parentElement.style.background=""}
  // un glissé n'est pas un toucher : on n'ouvre rien en relâchant
  const stop=ev=>{ev.stopPropagation();ev.preventDefault()};document.addEventListener("click",stop,{capture:true,once:true});setTimeout(()=>document.removeEventListener("click",stop,{capture:true}),60)}
document.addEventListener("touchstart",e=>{const t=e.touches[0];glDebut(e.target,t.clientX,t.clientY)},{passive:true});
document.addEventListener("touchmove",e=>{const t=e.touches[0];if(glBouge(t.clientX,t.clientY))e.preventDefault()},{passive:false});
document.addEventListener("touchend",glFin);document.addEventListener("touchcancel",glFin);
document.addEventListener("pointerdown",e=>{if(e.pointerType==="mouse")glDebut(e.target,e.clientX,e.clientY)});
document.addEventListener("pointermove",e=>{if(e.pointerType==="mouse")glBouge(e.clientX,e.clientY)});
document.addEventListener("pointerup",e=>{if(e.pointerType==="mouse")glFin()});

    if(el.scrollWidth>el.clientWidth+1){el.style.whiteSpace="normal";el.style.overflowWrap="anywhere"}}}
addEventListener("resize",()=>{if(S.tab==="agenda")fitWeek()});
function weekStep(n){S.sel=null;S.day=addDays(S.day,n);if(parse(S.day).getDay()===0)S.day=addDays(S.day,1);S.wanim=n>0?"wanim-l":"wanim-r";render()}
/* Glisser un rendez-vous : doigt appuyé ~0,3 s, puis on glisse */
let dg=null;
document.addEventListener("pointerdown",e=>{
  const el=e.target.closest(".wblk,.dlayer .blk");if(!el)return;
  const r=S.rdvs.find(x=>x.id===el.dataset.id);if(!r)return;
  const rc=el.getBoundingClientRect();
  dg={el,r,x0:e.clientX,y0:e.clientY,rc,on:false,moved:false,week:el.classList.contains("wblk")};
  dg.timer=setTimeout(()=>{if(!dg)return;dg.on=true;S.dragged=true;el.classList.add("lift");navigator.vibrate?.(15);dragMove(dg.x0,dg.y0)},300);
});
function dragMove(x,y){
  const el=dg.el,r=dg.r;
  if(dg.week){
    const g=document.getElementById("wbody");if(!g)return;const gr=g.getBoundingClientRect(),k=gr.height/g.offsetHeight||1;
    const cols=[...g.querySelectorAll(".wcol")],rects=cols.map(c=>c.getBoundingClientRect());
    let ti=rects.findIndex(q=>x>=q.left&&x<q.right);if(ti<0)ti=x<rects[0].left?0:5;
    const oi=cols.indexOf(el.parentElement),pitch=(rects[1].left-rects[0].left)/k;
    const A=+g.dataset.a,N=plage()[1]/30-A/30;
    let slot=Math.round(((y-gr.top)-(dg.y0-dg.rc.top))/k/SLOT);slot=Math.max(0,Math.min(N-1,slot));
    dg.t={date:cols[ti].dataset.d,s:A+slot*30};
    el.style.top=(slot*SLOT+1)+"px";el.style.transform=`translateX(${(ti-oi)*pitch}px)`;
  }else{
    const g=document.getElementById("dgrid");if(!g)return;const gr=g.getBoundingClientRect(),k=gr.height/g.offsetHeight||1;
    let slot=Math.round(((y-gr.top)-(dg.y0-dg.rc.top))/k/DROW);slot=Math.max(0,Math.min((H1-H0)*2-1,slot));
    el.style.pointerEvents="none";const under=document.elementFromPoint(x,y)?.closest(".dstrip button");el.style.pointerEvents="";
    document.querySelectorAll(".dstrip button").forEach(b=>b.classList.toggle("target",b===under&&b.dataset.d!==S.day));
    dg.t={date:under?under.dataset.d:S.day,s:H0*60+slot*30};el.style.top=(slot*DROW+2)+"px";
  }
  el.querySelector(".dropto").textContent=(dg.t.date!==r.date?WD[(parse(dg.t.date).getDay()+6)%7]+" ":"")+hhmm(dg.t.s).replace(/^0/,"").replace(":","h");
}
document.addEventListener("pointermove",e=>{if(!dg)return;
  if(!dg.on){if(Math.hypot(e.clientX-dg.x0,e.clientY-dg.y0)>8){clearTimeout(dg.timer);dg.moved=true}return}
  e.preventDefault();dragMove(e.clientX,e.clientY)},{passive:false});
async function dragEnd(cancel){if(!dg)return;clearTimeout(dg.timer);const d=dg;dg=null;
  if(!d.on)return;
  setTimeout(()=>{S.dragged=false},400);S.swiped=true;setTimeout(()=>{S.swiped=false},400);
  if(cancel||!d.t){render();return}
  const r=d.r,heure=hhmm(d.t.s);
  if(d.t.date===r.date&&heure===r.heure){render();return}
  const old={date:r.date,heure:r.heure};r.date=d.t.date;r.heure=heure;render();
  const dur=Number(r.duree)||60;
  const conflit=S.rdvs.find(x=>x.id!==r.id&&x.date===r.date&&x.statut!=="annule"&&mins(x.heure)<d.t.s+dur&&d.t.s<mins(x.heure)+(Number(x.duree)||60));
  const ok=await write(()=>S.db.doc("rdv/"+r.id).update({date:r.date,heure}),(conflit?"⚠️ Chevauche "+nomC(S.clients.get(conflit.clientId))+" · ":"Déplacé : ")+nomCourt(S.clients.get(r.clientId))+" → "+cap(fDay.format(parse(r.date)))+" "+heure.replace(":","h"));
  if(!ok){r.date=old.date;r.heure=old.heure;render()}
}
document.addEventListener("pointerup",()=>dragEnd(false));
document.addEventListener("pointercancel",()=>dragEnd(true));
document.addEventListener("contextmenu",e=>{if(e.target.closest(".wblk,.blk"))e.preventDefault()});

let sw=null;
document.addEventListener("pointerdown",e=>{if(S.tab!=="agenda"||!e.target.closest("#wview")||e.target.closest("#dscroll"))return;sw={x:e.clientX,y:e.clientY};S.swiped=false});
document.addEventListener("pointerup",e=>{if(!sw)return;const dx=e.clientX-sw.x,dy=e.clientY-sw.y;sw=null;if(S.dragged)return;
  if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.4){S.swiped=true;weekStep(dx<0?7:-7);setTimeout(()=>{S.swiped=false},350)}});
document.addEventListener("pointercancel",()=>{sw=null});
document.addEventListener("change",e=>{if(e.target.id==="jump"&&e.target.value){const n=e.target.value;S.wanim=n>S.day?"wanim-l":n<S.day?"wanim-r":"";S.day=n;render()}});
document.addEventListener("submit",e=>{const f=e.target.closest("form[data-todo]");if(!f)return;e.preventDefault();
  const k=f.dataset.todo,inp=f.querySelector("input"),v=inp.value.trim();if(!v)return;
  S.jour[k]=[...(S.jour[k]||[]),{t:v,fait:false}];inp.value="";saveJour();setTimeout(()=>document.getElementById("add-"+k)?.focus(),0)});
let azDoigt=false,azDer="";
const azSous=e=>{const b=document.elementFromPoint(e.clientX,e.clientY)?.closest?.("[data-az]");if(b&&b.dataset.az!==azDer){azDer=b.dataset.az;allerLettre(azDer)}};
document.addEventListener("pointerdown",e=>{if(!e.target.closest(".azbar"))return;e.preventDefault();azDoigt=true;azDer="";azSous(e)});
document.addEventListener("pointermove",e=>{if(azDoigt)azSous(e)});
document.addEventListener("pointerup",()=>{azDoigt=false});document.addEventListener("pointercancel",()=>{azDoigt=false});
document.addEventListener("input",e=>{if(e.target.id==="q"){S.q=e.target.value;S._focusQ=true;render()}});
document.getElementById("btnAdd").onclick=()=>S.tab==="clientes"?openClient(null):openRdv(null,{date:S.day});
document.getElementById("btnReglages").onclick=openReglages;
document.getElementById("btnFaire").onclick=openAFaire;
const pw=document.getElementById("pw");
function fit(){if(innerWidth<=600){pw.style.transform="";pw.style.margin="";return}
  const k=Math.min(1,(innerHeight-48)/880,(innerWidth-32)/421);
  pw.style.transform="scale("+k+")";pw.style.margin=(-(880*(1-k))/2)+"px "+(-(421*(1-k))/2)+"px"}
addEventListener("resize",fit);fit();
const clk=document.getElementById("clock");function tick(){const d=new Date();clk.textContent=d.getHours()+":"+pad(d.getMinutes())}tick();setInterval(tick,30000);
// toutes les minutes : la case de l'heure actuelle avance (sauf si une fenêtre est ouverte)
setInterval(()=>{if((S.tab==="agenda"||S.tab==="jour")&&!L.innerHTML&&!dg)render()},60000);
render();
})();
</script>
